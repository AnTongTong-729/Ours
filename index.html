<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>ours</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ours">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Gaegu&family=Gowun+Dodum&family=Grand+Hotel&family=Hi+Melody&family=Jua&family=Nanum+Pen+Script&family=Poor+Story&family=Single+Day&display=swap" rel="stylesheet">
<style>
:root{
  /* ours: glossy black glass with a candy-pink accent. Jua for the app's own words, Gowun Dodum for small print,
     each person's chosen handwriting for what they write, Nanum Pen for the daily prompts. One phone-width column. */
  --text:#fbf3f7;
  --muted:#a7969e;
  --pink:#ff4f9a;
  --pink-soft:#ff9cc6;
  --pink-ink:#2a0716;
  --line:rgba(255,255,255,.08);
  --glass:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.035) 42%,rgba(255,255,255,.018) 100%);
  --glass-base:rgba(16,12,14,.58);
  --hi:inset 0 1px 0 rgba(255,255,255,.17),inset 0 -1px 0 rgba(0,0,0,.35);
  --drop:0 12px 30px rgba(0,0,0,.5);
  --grad:linear-gradient(45deg,#ff2d86 0%,#ff5fa6 45%,#ffb3d4 100%);
  --candy:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.14) 47%,rgba(255,255,255,0) 53%),linear-gradient(180deg,#ff6dab 0%,#ef3584 100%);
  --candy-hi:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 2px rgba(120,0,50,.35),0 8px 22px rgba(255,79,154,.32);
  --font-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-cute:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --font-logo:"Grand Hotel","Jua",cursive;
  --font-hand:"Nanum Pen Script","Jua",cursive;
  --col:470px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:#000}
html,body{margin:0;min-height:100%;color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
body{background:transparent}
/* the glossy black: a cool sheen band, a light reflection from the top-left, a pink glow from below */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  linear-gradient(116deg,transparent 0 24%,rgba(255,255,255,.075) 33%,rgba(255,255,255,.02) 41%,transparent 49%),
  linear-gradient(116deg,transparent 0 58%,rgba(255,255,255,.035) 63%,transparent 68%),
  radial-gradient(80% 42% at 12% -6%,rgba(255,255,255,.16),transparent 62%),
  radial-gradient(55% 30% at 92% 4%,rgba(255,170,210,.08),transparent 70%),
  radial-gradient(70% 50% at 100% 104%,rgba(255,79,154,.20),transparent 66%),
  radial-gradient(60% 40% at -10% 90%,rgba(140,90,255,.07),transparent 70%),
  linear-gradient(180deg,#0d0b0e 0%,#030203 46%,#070407 100%)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:var(--text)}
img{max-width:100%;display:block}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
b,strong,.btn,.link,.pill,.chip,.eyebrow,.sec-title,.view-title,.who,.prof-name,.stats,.sh-head h2,.story .lbl,.act,.ptabs button,.t-cta,.pk-first,.dcard figcaption,label.lbl,.toast,.badge,.picker,.fp small,.dialog p,.repost-line,.h-date{font-family:var(--font-cute);font-weight:400}
.app{max-width:var(--col);margin:0 auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:480px){.app{border:0}}

/* handwriting: each person's own font for what they write */
.hw{font-family:var(--hw-font),"Gowun Dodum",sans-serif;font-size:calc(var(--hw-base,16px) * var(--hw-k,1.15));line-height:1.36;letter-spacing:var(--hw-ls,0)}
.f-himelody{--hw-font:"Hi Melody";--hw-k:1.22}
.f-gamja{--hw-font:"Gamja Flower";--hw-k:1.16}
.f-poor{--hw-font:"Poor Story";--hw-k:1.08}
.f-gaegu{--hw-font:"Gaegu";--hw-k:1.2;--hw-ls:-.03em}
.f-single{--hw-font:"Single Day";--hw-k:1.06}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 8px 0 16px;background:linear-gradient(180deg,rgba(34,29,33,.72),rgba(8,6,8,.58));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.logo{font-family:var(--font-logo);font-size:36px;line-height:1;text-decoration:none;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 4px 0 0;letter-spacing:.01em;filter:drop-shadow(0 0 14px rgba(255,79,154,.35))}
.logo.big{font-size:64px}
.ic{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;position:relative}
.ic svg{width:26px;height:26px}
.ic.sm svg{width:20px;height:20px}
.dot{position:absolute;top:9px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px #000,0 0 8px rgba(255,79,154,.8)}
.status{margin:10px 16px 0;padding:10px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,79,154,.16),rgba(255,79,154,.06));border:1px solid rgba(255,120,180,.28);box-shadow:var(--hi);color:var(--pink-soft);font-size:13.5px}
main{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

/* bottom tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--col);display:grid;grid-template-columns:repeat(5,1fr);height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,rgba(34,29,33,.74),rgba(6,5,6,.86));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-top:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);z-index:20}
.tabs a{display:grid;place-items:center;color:var(--muted);text-decoration:none}
.tabs a svg{width:26px;height:26px}
.tabs a.on{color:var(--text)}
.tabs a.on svg{stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.tabs a[data-nav="new"].on{color:var(--pink)}
.tabs a[data-nav="new"].on svg{filter:drop-shadow(0 0 8px rgba(255,79,154,.7))}
.tabs a.on .av{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--text)}

/* avatars */
.av{--s:32px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;position:relative}
.av.ring{background:var(--grad);padding:2.5px;box-shadow:0 0 14px rgba(255,79,154,.25)}
.av.ring.seen{background:linear-gradient(180deg,#5a4b52,#2a2226);box-shadow:none}
.av-in{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 34% 24%,rgba(255,255,255,.28),rgba(255,255,255,0) 46%),linear-gradient(160deg,#4a2a3a,#1c1016);color:var(--pink-soft);font-family:var(--font-cute);font-size:calc(var(--s)*.42);line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.av.ring .av-in{border:2.5px solid #000}
.av-in img{width:100%;height:100%;object-fit:cover}
.qbubble{font-family:var(--font-hand);font-size:38px;color:var(--pink);padding-top:4px;background:radial-gradient(circle at 34% 24%,rgba(255,255,255,.26),rgba(255,255,255,0) 46%),linear-gradient(160deg,#3a1526,#160910)}
.qbubble svg{width:26px;height:26px;color:var(--pink)}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none}
.story .lbl{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}

/* feed cards */
.card{border-bottom:1px solid var(--line);padding-bottom:14px}
.repost-line{display:flex;align-items:center;gap:6px;padding:12px 16px 0;color:var(--muted);font-size:13px}
.repost-line svg{width:15px;height:15px;color:var(--pink);flex:none}
.repost-line b{color:var(--text)}
.repost-note{--hw-base:16px;margin:8px 16px 0;padding:2px 0 2px 12px;border-left:2px solid var(--pink);white-space:pre-wrap}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 10px 14px}
.who{display:flex;align-items:center;gap:10px;font-size:15px;text-align:left}
.media{position:relative;background:#0b0b0b;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;max-height:72vh}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative}
.slide img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.broken{display:grid;place-items:center;min-height:120px}
.broken img{display:none}
.broken::after{content:"사진을 불러오지 못했어요";color:var(--muted);font-size:12.5px;padding:8px;text-align:center}
.av-in.broken::after,.tile.broken::after,.dimg.broken::after{content:""}
.badge{position:absolute;top:12px;right:12px;background:linear-gradient(180deg,rgba(60,52,56,.7),rgba(10,8,9,.7));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);font-size:12.5px;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dots i.on{background:var(--pink);box-shadow:0 0 0 1.5px #fff}
.arrow{display:none;position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,#fff,#e9e2e6);box-shadow:0 2px 8px rgba(0,0,0,.4);color:#111;font-size:22px;line-height:1;place-items:center;padding-bottom:3px}
.arrow.prev{left:10px}.arrow.next{right:10px}
@media (hover:hover){.media:hover .arrow{display:grid}}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.burst svg{width:104px;height:104px;color:var(--pink);filter:drop-shadow(0 6px 26px rgba(255,79,154,.65))}
.burst.go{animation:burst .9s ease forwards}
@keyframes burst{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.94)}45%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.actions{display:flex;align-items:center;gap:2px;padding:6px 8px 2px}
.act{display:inline-flex;align-items:center;gap:5px;height:42px;padding:0 8px;border-radius:21px;font-size:14.5px;font-variant-numeric:tabular-nums}
.act svg{width:26px;height:26px}
.act.on{color:var(--pink)}
.act.on svg{filter:drop-shadow(0 0 6px rgba(255,79,154,.55))}
.act.like.on svg{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.28)}}
.c-body p{margin:0}
.likes,.cap,.cmt,.more,.when{padding:0 16px}
.likes{font-size:14px;display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.stack{display:inline-flex}
.stack .av{margin-left:-6px;box-shadow:0 0 0 2px #000}
.stack .av:first-child{margin-left:0}
.cap{--hw-base:16px;white-space:pre-wrap;margin:2px 0}
.cap b,.cmt b{font-size:15px;margin-right:7px}
.more{display:block;color:var(--muted);font-size:14px;margin:4px 0 2px;text-align:left}
.cmt{--hw-base:15.5px;white-space:pre-wrap;margin:1px 0}
.when{display:block;color:var(--muted);font-size:11.5px;margin-top:6px;letter-spacing:.02em}
.feed-end-note{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:28px 0 12px}
.feed-end-note svg{width:22px;height:22px;color:var(--pink);filter:drop-shadow(0 0 8px rgba(255,79,154,.6))}
.empty{color:var(--muted);text-align:center;padding:36px 16px;margin:0}
.empty.sm{padding:18px 8px;font-size:14px}

/* glass surfaces */
.q-card,.ans,.teaser,.history,.dcard,.rp-prev,.note-card,.picker,.fp,.tbtn,.btn.ghost{background:var(--glass),var(--glass-base);border:1px solid rgba(255,255,255,.09);box-shadow:var(--hi),var(--drop);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tbtn,.btn.ghost,.fp{box-shadow:var(--hi)}

/* welcome */
.welcome{padding:26px 16px;display:grid;gap:14px}
.w-hero{text-align:center;display:grid;justify-items:center;gap:6px;padding:8px 0 10px}
.w-hero p{margin:0 0 10px;color:var(--muted)}
.teaser{display:grid;gap:6px;width:100%;text-align:left;border-radius:22px;padding:18px 18px 16px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--pink)}
.hand{font-family:var(--font-hand);font-size:31px;line-height:1.15;color:var(--text);text-wrap:balance}
.t-cta{font-size:14px;color:var(--pink-soft)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:14px;font-size:16px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--candy);color:#fff;text-shadow:0 1px 1px rgba(120,0,50,.4);border:1px solid rgba(255,150,195,.55);box-shadow:var(--candy-hi)}
.btn.primary:active{filter:brightness(.94)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{color:var(--text)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.link{color:var(--pink);font-size:15px}
.link.sm{font-size:13.5px;margin-left:auto}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.45);transition:border-color .2s,box-shadow .2s}
textarea{--hw-base:17px;resize:vertical;min-height:100px;line-height:1.5}
textarea.hw,input.hw{line-height:1.4}
input[type=text],input[type=email],input[type=password]{--hw-base:16px;height:48px}
#cmt-in{height:44px}
textarea:focus,input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{border-color:rgba(255,79,154,.8);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px rgba(255,79,154,.18)}
::placeholder{color:#7d6d75;opacity:1}
label.lbl{font-size:14px;color:var(--muted);margin-bottom:-6px}
.hint{color:var(--muted);font-size:13px;margin:0;min-height:1em}
.view-title{font-size:21px;margin:4px 0 0}

/* question & drawing */
.q-wrap,.d-wrap,.new-wrap{padding:16px;display:grid;gap:14px}
.q-date{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;min-height:28px}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--candy);color:#fff;text-shadow:0 1px 1px rgba(120,0,50,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 12px rgba(255,79,154,.3);font-size:13px}
.pill.ghost{background:var(--glass),var(--glass-base);border:1px solid rgba(255,79,154,.7);color:var(--pink);text-shadow:none;box-shadow:var(--hi)}
.q-card{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 26px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,79,154,.32),transparent 60%),var(--glass),var(--glass-base);border-color:rgba(255,140,190,.22)}
.q-card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(158deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.05) 28%,rgba(255,255,255,0) 46%)}
.q-card .eyebrow{font-variant-numeric:tabular-nums}
.q-text{position:relative;font-family:var(--font-hand);font-weight:400;font-size:42px;line-height:1.1;margin:10px 0 0;text-wrap:balance;color:#fff;text-shadow:0 2px 18px rgba(255,79,154,.25)}
.q-card::after{content:"";position:absolute;right:-18px;bottom:-26px;width:110px;height:110px;background:var(--pink);opacity:.12;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 20.3s-7.6-4.5-9.4-9.4C1.4 7.6 3.5 4.3 6.9 4.3c2.2 0 3.7 1.3 5.1 3.1 1.4-1.8 2.9-3.1 5.1-3.1 3.4 0 5.5 3.3 4.3 6.6-1.8 4.9-9.4 9.4-9.4 9.4z'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 20.3s-7.6-4.5-9.4-9.4C1.4 7.6 3.5 4.3 6.9 4.3c2.2 0 3.7 1.3 5.1 3.1 1.4-1.8 2.9-3.1 5.1-3.1 3.4 0 5.5 3.3 4.3 6.6-1.8 4.9-9.4 9.4-9.4 9.4z'/></svg>") center/contain no-repeat;transform:rotate(-14deg)}
.ans{border-radius:20px;padding:14px 16px;display:grid;gap:10px}
.ans-head{display:flex;align-items:center;gap:8px;font-size:14px}
.ans-head b{font-size:15px}
.ans-head .t{margin-left:auto;color:var(--muted);font-size:12px}
.ans-text{--hw-base:18px;white-space:pre-wrap;margin:0}
.ans.locked .ans-text{filter:blur(5px);user-select:none;color:var(--muted)}
.lock-note{display:flex;align-items:center;gap:6px;color:var(--pink-soft);font-size:13px;margin:0}
.lock-note svg{width:15px;height:15px}
.sec-title{font-size:17px;margin:14px 0 -4px}
.history{display:grid;border-radius:18px;overflow:hidden}
.h-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.h-row:last-child{border-bottom:0}
.h-date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.h-q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:var(--muted);white-space:nowrap;box-shadow:var(--hi)}
.chip.both{border-color:rgba(255,79,154,.8);color:var(--pink)}
.chip.need{background:var(--candy);color:#fff;border-color:rgba(255,150,195,.55);text-shadow:0 1px 1px rgba(120,0,50,.4)}
.h-thumbs{display:flex;gap:4px}
.h-thumbs span{width:34px;height:34px;border-radius:9px;overflow:hidden;background:#fff;display:grid;place-items:center}
.h-thumbs span.no{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.14)}
.h-thumbs span.lk{background:#1c1016;color:var(--pink-soft)}
.h-thumbs svg{width:14px;height:14px}
.h-thumbs img{width:100%;height:100%;object-fit:cover}

.studio{display:grid;gap:12px}
.pad-wrap{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 0 6px rgba(255,255,255,.04),0 16px 44px rgba(0,0,0,.6),0 0 46px rgba(255,79,154,.14)}
#pad{display:block;width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair}
.tools{display:grid;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.65) 0,rgba(255,255,255,0) 44%),var(--c);box-shadow:inset 0 -2px 4px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.45)}
.sw.on{box-shadow:0 0 0 2px #000,0 0 0 4px var(--pink),0 0 12px rgba(255,79,154,.5)}
.tool-row{display:flex;gap:6px;align-items:center}
.tool-row .sep{flex:1}
.tbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.tbtn svg{width:20px;height:20px}
.tbtn.on{border-color:var(--pink);color:var(--pink)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.tbtn i{display:block;border-radius:50%;background:currentColor;width:var(--d);height:var(--d)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{margin:0;border-radius:18px;overflow:hidden;display:grid}

.dimg img{width:100%;height:100%;object-fit:cover}

.picker{display:grid;place-items:center;align-content:center;gap:8px;aspect-ratio:4/3;border:1.5px dashed rgba(255,120,180,.4);border-radius:24px;color:var(--pink-soft);background:radial-gradient(80% 80% at 50% 0%,rgba(255,79,154,.16),transparent),var(--glass),var(--glass-base);cursor:pointer;text-align:center;font-size:17px}

.pk-first{position:absolute;left:4px;bottom:4px;font-size:12px;background:var(--candy);color:#fff;border-radius:7px;padding:1px 7px}

/* handwriting picker */
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fp{display:grid;gap:2px;padding:12px 12px 10px;border-radius:16px;text-align:left;--hw-base:17px}
.fp .hw{line-height:1.2}
.fp small{color:var(--muted);font-size:12.5px}
.fp.on{border-color:var(--pink);background:linear-gradient(180deg,rgba(255,79,154,.22),rgba(255,79,154,.07)),var(--glass-base);box-shadow:var(--hi),0 0 0 1px var(--pink),0 0 18px rgba(255,79,154,.25)}
.fp.on small{color:var(--pink-soft)}

/* profile */
.prof-back{padding:12px 16px 0}
.prof-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:16px 16px 10px}

.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.prof-name{padding:0 16px;font-size:17px}
.prof-bio{--hw-base:15.5px;padding:2px 16px 0;margin:0;white-space:pre-wrap}

.ptabs button svg{width:18px;height:18px}
.ptabs button.on{color:var(--text);border-top-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:1;background:#0d0d0d;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.paper{background:#fff}
.tile .multi{position:absolute;top:6px;right:6px;width:18px;height:18px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile .tdate{position:absolute;left:6px;bottom:6px;font-family:var(--font-cute);font-size:12px;background:rgba(0,0,0,.66);color:#fff;padding:1px 7px;border-radius:7px;font-variant-numeric:tabular-nums}

.overlay.center{align-items:center;padding:24px}
.sheet{width:100%;max-width:var(--col);max-height:88vh;max-height:88dvh;background:linear-gradient(180deg,rgba(48,40,45,.94),rgba(16,13,15,.97) 38%);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border:1px solid rgba(255,255,255,.12);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 -20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:8px auto 0;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 18px;border-bottom:1px solid var(--line);flex:none;min-height:52px}
.sh-head h2{font-size:18px;margin:0}
.sh-body{overflow-y:auto;padding:12px 16px 16px;flex:1;min-height:0;display:grid;align-content:start;gap:12px}
.sheet-post .sh-body{padding:0}
.sheet-post .card{border:0}
.cmt-form{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex:none}
.cmt-form input{flex:1;border-radius:999px;height:44px;padding:0 16px}
.c-item{display:grid;grid-template-columns:auto 1fr;gap:10px}
.c-item p{--hw-base:15.5px;margin:0;white-space:pre-wrap}
.c-item b{font-size:15px;margin-right:7px}
.c-meta{color:var(--muted);font-size:12px;display:flex;gap:12px;margin-top:3px}
.c-meta button{color:var(--muted);font-size:12.5px;font-family:var(--font-cute)}
.sep-line{height:1px;background:var(--line)}
.rp-prev{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;border-radius:16px;padding:8px}
.rp-prev img{width:64px;height:64px;border-radius:11px;object-fit:cover}
.rp-prev p{--hw-base:15px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:4px 0}
.a-text{font-size:14px;line-height:1.45}
.a-text b{font-size:15px}
.a-text .hw{--hw-base:14.5px}
.a-text .muted{font-size:12.5px}
.a-item .thumb{width:44px;height:44px;border-radius:9px;overflow:hidden;background:#111}
.a-item .thumb img{width:100%;height:100%;object-fit:cover}
.a-item.new .a-text::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 6px rgba(255,79,154,.8);margin-right:6px;vertical-align:middle}
.form{display:grid;gap:12px}
.lead{margin:0;font-size:15px;line-height:1.6;text-align:center}
.ep-av{display:flex;align-items:center;gap:14px}
.adopt{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.adopt button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-family:var(--font-cute)}
.dialog{background:linear-gradient(180deg,rgba(52,44,49,.96),rgba(22,18,20,.98));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.7);border-radius:20px;max-width:320px;width:100%;overflow:hidden;text-align:center;animation:up .2s}
.dialog p{padding:24px 20px;margin:0;font-size:16px}
.dialog .row{border-top:1px solid var(--line);gap:0}
.dialog .row button{flex:1;height:50px;font-family:var(--font-cute);font-size:16px}
.dialog .row button+button{border-left:1px solid var(--line)}
.danger{color:#ff5b6b}
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:linear-gradient(180deg,#fff 0%,#f6eef2 55%,#ebe0e6 100%);box-shadow:inset 0 1px 0 #fff,0 10px 30px rgba(0,0,0,.55);color:#1b1016;padding:10px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* login */
.login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;overflow:auto;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.login-card{width:100%;max-width:380px;display:grid;gap:12px;padding:28px 22px 22px;border-radius:28px;background:var(--glass),rgba(16,12,14,.72);border:1px solid rgba(255,255,255,.12);box-shadow:var(--hi),0 30px 80px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.login-card .w-hero{padding:0}
.login-err{color:#ff7a8a;min-height:1.2em;margin:0;font-size:13.5px}
.acct{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
@keyframes up{from{transform:translateY(36px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="app">

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function patch(el, html) { if (!el) return false; if (el._h === html) return false; el.innerHTML = html; el._h = html; return true; }

const dateFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
function keyFromMs(ms) { const p = {}; for (const x of dateFmt.formatToParts(new Date(ms))) p[x.type] = x.value; return `${p.year}-${p.month}-${p.day}`; }
const todayKey = () => keyFromMs(Date.now());
function dayNum(key) { const [y, m, d] = key.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); }
const mod = (a, n) => ((a % n) + n) % n;
const questionFor = key => QUESTIONS[mod(dayNum(key) * 37, QUESTIONS.length)];
const topicFor = key => TOPICS[mod(dayNum(key) * 37 + 11, TOPICS.length)];
const WD = ['일', '월', '화', '수', '목', '금', '토'];
function fmtKey(key) { const [y, m, d] = key.split('-').map(Number); return `${m}월 ${d}일 ${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}요일`; }
function shortKey(key) { const [, m, d] = key.split('-').map(Number); return `${m}.${d}`; }
function timeAgo(ms) {
  if (!ms) return '';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 86400 * 7) return Math.floor(s / 86400) + '일 전';
  const k = keyFromMs(ms).split('-').map(Number);
  return (String(k[0]) !== todayKey().slice(0, 4) ? k[0] + '년 ' : '') + k[1] + '월 ' + k[2] + '일';
}
function fmtBytes(b) { if (b >= 1e9) return (b / 1e9).toFixed(1) + 'GB'; if (b >= 1e6) return (b / 1e6).toFixed(0) + 'MB'; return Math.max(0, Math.round(b / 1e3)) + 'KB'; }
function hasBatchim(w) {
  const ch = String(w).trim().slice(-1); const c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
  if (/[0-9]/.test(ch)) return '013678'.includes(ch);
  if (/[a-z]/i.test(ch)) return !/[aeiouy]/i.test(ch);
  return false;
}

async function decode(file) {
  if (window.createImageBitmap) {
    try { const b = await createImageBitmap(file, { imageOrientation: 'from-image' }); return { src: b, w: b.width, h: b.height, close: () => b.close && b.close() }; } catch (e) { /* fall back */ }
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = url; });
    return { src: img, w: img.naturalWidth, h: img.naturalHeight, close: () => URL.revokeObjectURL(url) };
  } catch (e) { URL.revokeObjectURL(url); throw e; }
}
async function compress(file, maxSide, quality, square) {
  let d;
  try { d = await decode(file); } catch (e) { throw { code: 'decode' }; }
  let sx = 0, sy = 0, sw = d.w, sh = d.h;
  if (square) { const m = Math.min(d.w, d.h); sx = (d.w - m) / 2; sy = (d.h - m) / 2; sw = sh = m; }
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * scale)), h = Math.max(1, Math.round(sh * scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(d.src, sx, sy, sw, sh, 0, 0, w, h); d.close();
  const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej({ code: 'decode' }), 'image/jpeg', quality));
  return { blob, w, h };
}

  up() { if (!this.cur) return; this.cur = null; this.saveDraft(); updateDrawButtons(); },

        const x = S.drawings.find(y => y.date === d && y.uid === u);

async function submitDrawing() {
  if (!Draw.strokes.length) { toast('먼저 그림을 그려 주세요'); return; }
  if (!guardWrite()) return;
  if (!S.assets) { toast(assetErrMsg({ code: 'not_granted' })); return; }
  const key = Draw.date || S.dDate || todayKey(); const btn = $('#d-submit');
  btn.disabled = true; btn.textContent = '올리는 중…'; btn._h = null;
  try {
    const blob = await Draw.exportBlob();
    const up = await uploadAsset(blob, 'image/png');
    const mine = myDrawing(key);
    const ok = await write(() => S.db.doc('drawings/' + key + '__' + safeKey(S.myId)).set({ date: key, uid: S.myId, imageId: up.id, createdAt: mine ? mine.createdAt : Date.now(), updatedAt: Date.now() }));
    if (ok) {
      if (mine && mine.imageId) dropAsset(mine.imageId);
      Draw.strokes = []; Draw.saveDraft(); Draw.redraw(); S.dRedraw = false;
      toast('그림을 올렸어요!');
    } else dropAsset(up.id);
  } catch (e) { toast(assetErrMsg(e)); }
  finally { $('#d-submit')._h = null; render(); }
}

/* ---------- new post ---------- */
const picked = [];
function renderPicked() {
  $('#picked').innerHTML = picked.map((p, i) => `<div class="pk"><img src="${p.url}" alt="고른 사진 ${i + 1}"><button type="button" data-act="pick-remove" data-i="${i}" aria-label="${i + 1}번째 사진 빼기">${ICON.close}</button>${i === 0 ? '<span class="pk-first">대표</span>' : ''}</div>`).join('');
  $('#post-btn').disabled = !picked.length;
  $('#picker').classList.toggle('compact', picked.length > 0);
  $('#picker-text').textContent = picked.length ? `사진 더 고르기 (${picked.length}/10)` : '사진 고르기';
  $('#picker-sub').hidden = picked.length > 0;
}
function onFilesPicked(files) {
  for (const f of files) {
    if (picked.length >= 10) { toast('사진은 한 번에 10장까지 올릴 수 있어요'); break; }
    if (f.type && !/^image\//.test(f.type)) continue;
    picked.push({ file: f, url: URL.createObjectURL(f) });
  }
  renderPicked();
}
async function createPost() {
  if (!picked.length) return;
  if (!guardWrite()) return;
  if (!S.assets) { toast(assetErrMsg({ code: 'not_granted' })); return; }
  const btn = $('#post-btn'), st = $('#new-status'); btn.disabled = true;
  const images = [];
  try {
    for (let i = 0; i < picked.length; i++) {
      st.textContent = `사진 올리는 중… ${i + 1}/${picked.length}`;
      const c = await compress(picked[i].file, 1600, 0.85, false);
      const up = await uploadAsset(c.blob, 'image/jpeg');
      images.push({ id: up.id, w: c.w, h: c.h });
    }
    st.textContent = '게시하는 중…';
    const caption = $('#cap-in').value.trim();
    const ok = await write(() => S.db.collection('posts').doc().set({ author: S.myId, images, caption, createdAt: Date.now() }));
    if (!ok) throw { code: '_handled' };
    picked.forEach(p => URL.revokeObjectURL(p.url)); picked.length = 0; renderPicked();
    $('#cap-in').value = ''; st.textContent = '';
    toast('게시했어요!'); scrollPos.home = 0; go('home');
  } catch (e) {
    images.forEach(im => dropAsset(im.id));
    st.textContent = '';
    if (!(e && e.code === '_handled')) toast(assetErrMsg(e));
  } finally { btn.disabled = !picked.length; }
}
function renderNew() {
  const note = $('#new-note'); let msg = '';
  if (S.mode === 'live' && (!S.canWrite || !S.assets)) msg = '사진을 올릴 권한이 없어요. setup.sql에 내 이메일이 들어 있는지 확인해 주세요.';
  note.hidden = !msg; patch(note, esc(msg));
  const cap = $('#cap-in'); if (cap.className !== hw(S.myId)) cap.className = hw(S.myId);
}

/* ---------- likes, comments, reposts, deletes ---------- */
async function toggleLike(postId, onlyOn) {
  if (!postId) return;
  const k = postId + '__' + safeKey(S.myId);
  if (S.pendingLikes.has(k)) return;
  const liked = S.likes.some(l => l.postId === postId && l.uid === S.myId);
  if (onlyOn && liked) return;
  S.pendingLikes.add(k);
  await write(() => liked ? S.db.doc('likes/' + k).delete() : S.db.doc('likes/' + k).set({ postId, uid: S.myId, createdAt: Date.now() }));
  S.pendingLikes.delete(k);
}
async function deletePost(postId) {
  const p = IDX.posts[postId]; if (!p) return;
  if (!(await confirmDialog('이 게시물을 삭제할까요? 댓글과 좋아요도 함께 지워져요.', '삭제'))) return;
  const ok = await write(async () => {
    await S.db.doc('posts/' + postId).delete();
    for (const x of S.likes.filter(l => l.postId === postId)) await S.db.doc('likes/' + x.id).delete();
    for (const x of S.comments.filter(c => c.postId === postId)) await S.db.doc('comments/' + x.id).delete();
    for (const x of S.reposts.filter(r => r.postId === postId)) await S.db.doc('reposts/' + x.id).delete();
  });
  if (ok) { (p.images || []).forEach(im => dropAsset(im.id)); if (S.sheet && S.sheet.postId === postId) closeSheet(true); toast('삭제했어요'); }
}
async function sendComment() {
  const inp = $('#cmt-in'); const text = ((inp && inp.value) || '').trim(); if (!text || !S.sheet) return;
  const postId = S.sheet.postId; inp.disabled = true;
  const ok = await write(() => S.db.collection('comments').add({ postId, uid: S.myId, text, createdAt: Date.now() }));

}
async function deleteComment(id) {

  if (isMe && S.usage && S.usage.maxBytes) {
    const pct = Math.min(100, S.usage.bytes / S.usage.maxBytes * 100);
    h += `<div class="meter-wrap"><span>사진 저장 공간 ${fmtBytes(S.usage.bytes)} / ${fmtBytes(S.usage.maxBytes)} 사용</span><div class="meter"><i style="width:${pct.toFixed(1)}%"></i></div></div>`;
  }
  const tab = S.profileTab;
  h += `<div class="ptabs" role="tablist">

    <button type="button" role="tab" class="${tab === 'reposts' ? 'on' : ''}" aria-selected="${tab === 'reposts'}" data-act="prof-tab" data-tab="reposts">${ICON.repost}리포스트</button>
    <button type="button" role="tab" class="${tab === 'drawings' ? 'on' : ''}" aria-selected="${tab === 'drawings'}" data-act="prof-tab" data-tab="drawings">${ICON.brush}그림</button></div>`;
  const postTile = p => { const im = (p.images || [])[0]; return `<button class="tile" type="button" data-act="open-post" data-id="${esc(p.id)}" aria-label="게시물 보기">${im ? `<img src="${blobUrl(im.id)}" alt="" loading="lazy">` : ''}${(p.images || []).length > 1 ? ICON.multi : ''}</button>`; };
  let tiles = '', emptyMsg = '';
  if (tab === 'posts') { tiles = posts.map(postTile).join(''); emptyMsg = '아직 올린 사진이 없어요'; }
  else if (tab === 'reposts') {
    tiles = S.reposts.filter(r => r.uid === uid).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map(r => IDX.posts[r.postId]).filter(Boolean).map(postTile).join('');
    emptyMsg = '아직 리포스트한 사진이 없어요';
  } else {
    tiles = S.drawings.filter(d => d.uid === uid).sort((a, b) => a.date < b.date ? 1 : -1).map(d => {

    }).join('');

/* ---------- activity ---------- */
function activityItems() {
  const me = S.myId; if (!me) return [];
  const mineP = new Set(S.posts.filter(p => p.author === me).map(p => p.id));
  const it = [];
  for (const l of S.likes) if (l.uid !== me && mineP.has(l.postId)) it.push({ at: l.createdAt, uid: l.uid, kind: 'like', postId: l.postId });
  for (const c of S.comments) if (c.uid !== me && mineP.has(c.postId)) it.push({ at: c.createdAt, uid: c.uid, kind: 'comment', postId: c.postId, text: c.text });
  for (const r of S.reposts) if (r.uid !== me && mineP.has(r.postId)) it.push({ at: r.createdAt, uid: r.uid, kind: 'repost', postId: r.postId });
  for (const p of S.posts) if (p.author !== me) it.push({ at: p.createdAt, uid: p.author, kind: 'post', postId: p.id });
  for (const a of S.answers) if (a.uid !== me) it.push({ at: a.createdAt, uid: a.uid, kind: 'answer', date: a.date });
  for (const d of S.drawings) if (d.uid !== me) it.push({ at: d.updatedAt || d.createdAt, uid: d.uid, kind: 'drawing', date: d.date });
  return it.filter(x => x.at).sort((a, b) => b.at - a.at).slice(0, 60);
}
function activityHTML() {
  const items = activityItems(); const seen = S.sheet ? S.sheet.seenBefore || 0 : 0;
  if (!items.length) return '<p class="empty sm">아직 새 소식이 없어요.</p>';
  return items.map(x => {
    const nm = nameOf(x.uid), j = ga(nm);
    let t;
    if (x.kind === 'like') t = `${j} 내 사진을 좋아해요`;
    else if (x.kind === 'comment') t = `${j} 댓글을 남겼어요: <span class="${hw(x.uid)}">${esc(x.text)}</span>`;
    else if (x.kind === 'repost') t = `${j} 내 사진을 리포스트했어요`;
    else if (x.kind === 'post') t = `${j} 새 사진을 올렸어요`;
    else if (x.kind === 'answer') t = `${j} ${x.date === todayKey() ? '오늘의' : shortKey(x.date)} 질문에 답했어요`;
    else t = `${j} ${x.date === todayKey() ? '오늘의' : shortKey(x.date)} 그림을 그렸어요`;
    const p = x.postId ? IDX.posts[x.postId] : null; const im = p && (p.images || [])[0];
    return `<button class="a-item${x.at > seen ? ' new' : ''}" type="button" data-act="act-go" data-kind="${x.kind}" data-id="${esc(x.postId || '')}" data-date="${esc(x.date || '')}">${avatar(x.uid, 40)}<span class="a-text"><b>${esc(nm)}</b>${t} <span class="muted">${timeAgo(x.at)}</span></span>${im ? `<span class="thumb"><img src="${blobUrl(im.id)}" alt="" loading="lazy"></span>` : '<span></span>'}</button>`;

  try { session = await B.session(); } catch (e) { console.warn('[ours]', e); }
  if (!session) session = await askLogin();
  const c = B.connect(session);
  const [db, user, assets] = await Promise.all([c.use('db'), c.use('user'), c.use('assets')]);
  S.db = db; S.user = user; S.assets = assets;
  const me = await user.me(); S.myId = me.id; S.myName = me.name || '';
  S.canWrite = true; S.canWriteKnown = true;
  if ((await B.isMember()) === false) { S.canWrite = false; S.notMember = true; }
  S.lastSeen = getSeen();
  S.mode = 'live';
  sub('profiles', db.collection('profiles'));
  sub('posts', db.collection('posts').orderBy('createdAt', 'desc').limit(500));
  sub('likes', db.collection('likes').orderBy('createdAt', 'desc').limit(1000));
  sub('comments', db.collection('comments').orderBy('createdAt', 'desc').limit(1000));
  sub('reposts', db.collection('reposts').orderBy('createdAt', 'desc').limit(500));
  sub('answers', db.collection('answers').orderBy('createdAt', 'desc').limit(1000));
  sub('drawings', db.collection('drawings').orderBy('createdAt', 'desc').limit(500));
  refreshPeople(); render();
}
boot();
})();
</script>
