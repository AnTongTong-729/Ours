.rp{display:grid;gap:12px;padding-bottom:4px}
.rp-who{display:flex;align-items:center;gap:8px;margin:0;font-size:13.5px;color:var(--muted);min-width:0}
.rp-who span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-stage{position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 0 0 .5px var(--line),0 10px 30px rgba(0,0,0,.18)}
#rp-cv{display:block;width:100%;aspect-ratio:1;height:auto}
.rp-msg{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:20px;text-align:center;color:#8a8a8e;font-size:14px;background:rgba(255,255,255,.9)}
.rp-msg[hidden]{display:none}
.rp-bar{height:4px;border-radius:2px;background:rgba(var(--fg),.1);overflow:hidden}
.rp-bar i{display:block;height:100%;width:0;background:var(--candy)}
.rp-ctl{display:flex;align-items:center;justify-content:center;gap:22px}
.rp-play{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--candy);color:#fff;box-shadow:0 8px 22px rgba(255,79,154,.35)}
.rp-play svg{width:24px;height:24px}
.rp-play svg path{fill:currentColor}
.rp-play:disabled{opacity:.45}
.rp-speed{min-width:46px;height:34px;border-radius:17px;background:rgba(var(--fg),.08);font-family:var(--font-cute);font-size:15px}
/* update 8: story ring that pops, drawings replay side by side */
.av.sring:not(.seen){background:linear-gradient(135deg,#ffffff 0%,#ffe1ee 50%,#ffffff 100%);padding:3px;box-shadow:0 0 12px rgba(255,79,154,.55)}
.av.sring:not(.seen) .av-in{border-width:2.5px}
.dimg.has-rp{position:relative}
.dimg .dcv{position:absolute;inset:0;width:100%;height:100%;background:#fff;opacity:0;transition:opacity .25s;pointer-events:none}
.dimg.has-rp.playing .dcv{opacity:1}
.duo-ctl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:12px}
.duo-play{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:22px;background:rgba(var(--fg),.08);font-family:var(--font-cute);font-size:15px;color:var(--text)}
.duo-play svg{width:18px;height:18px;color:var(--pink)}
.duo-play svg path{fill:currentColor}
.duo-play.on{background:var(--candy);color:#fff}
.duo-play.on svg{color:#fff}
.duo-play:disabled{opacity:.55}
.duo-bar{grid-column:1/-1}
.ptr.ready{animation:ptrPop .32s cubic-bezier(.2,1.6,.35,1)}
@keyframes ptrPop{0%{scale:1}45%{scale:1.32}100%{scale:1}}
/* update 9: daily attendance */
.att-card{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:8px 16px 2px;padding:12px 14px;border-radius:20px;background:var(--surface);border:.5px solid var(--line);text-align:left}
.att-info{flex:1;min-width:0;display:grid;gap:7px}
.att-info b{font-family:var(--font-cute);font-weight:400;font-size:15.5px}
.att-info b small{font-size:12px;color:var(--pink);margin-left:4px}
.att-row{display:flex;gap:5px}
.att-st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--fg),.08);flex:none}
.att-st i{font-style:normal;font-size:11px;line-height:1;display:grid;place-items:center}
.att-st i svg{width:12px;height:12px;color:#fff}
.att-st.done{background:var(--candy)}
.att-st.now{box-shadow:0 0 0 2px var(--pink) inset}
.att-btn{flex:none;padding:9px 14px;border-radius:999px;background:var(--candy);color:#fff;font-family:var(--font-cute);font-size:14.5px;box-shadow:0 6px 16px rgba(255,79,154,.3)}
.att-btn b{font-weight:400}
.att-done{flex:none;display:grid;justify-items:end;font-family:var(--font-cute);font-size:13.5px;color:var(--muted)}
.att-done small{font-size:11.5px;color:var(--pink)}
.att{display:grid;gap:14px;padding-bottom:6px}
.att-head{margin:0;font-family:var(--font-cute);font-size:21px;text-align:center}
.att-sub{margin:-6px 0 0;font-size:13px;line-height:1.55;text-align:center}
.att-sub .coin,.att .btn .coin,.pet-wrap .muted .coin{width:15px;height:15px;vertical-align:-2px}
.att{min-width:0}
.att-row.big{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;min-width:0}
.att-row.big .att-st{width:auto;height:auto;min-width:0;aspect-ratio:.72;border-radius:14px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:6px 2px;gap:2px}
.att-row.big .att-st small{font-size:11px;color:var(--muted);font-family:var(--font-cute)}
.att-row.big .att-st.done small{color:rgba(255,255,255,.85)}
.att-row.big .att-st i{font-size:20px;align-self:center}
.att-row.big .att-st i svg{width:20px;height:20px}
.att-row.big .att-st b{display:flex;align-items:center;gap:1px;font-family:var(--font-cute);font-weight:400;font-size:12px}
.att-row.big .att-st b .coin{width:12px;height:12px}
.att-row.big .att-st.gift{background:linear-gradient(160deg,rgba(255,210,94,.22),rgba(255,79,154,.16))}
.att-row.big .att-st.gift.done{background:var(--candy)}
.att-row.big .att-st.now{box-shadow:0 0 0 2px var(--pink) inset;animation:attNow 1.6s ease-in-out infinite}
.att-st.pop{animation:attPop .55s cubic-bezier(.2,1.6,.35,1)}
@keyframes attNow{50%{transform:translateY(-3px)}}
@keyframes attPop{0%{transform:scale(.4) rotate(-14deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:none}}
.att-partner{display:flex;align-items:center;gap:8px;margin:0;font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left"><button class="ic" type="button" id="set-btn" data-act="go" data-view="settings" aria-label="설정" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><a class="logo" href="#home" data-nav="home" aria-label="ours 홈">ours</a></div>
    <div class="top-actions">
    <button class="ic" type="button" data-act="go" data-view="calendar" aria-label="달력"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    <button class="ic" id="act-btn" data-act="activity" aria-label="소식 보기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20.3s-7.6-4.5-9.4-9.4C1.4 7.6 3.5 4.3 6.9 4.3c2.2 0 3.7 1.3 5.1 3.1 1.4-1.8 2.9-3.1 5.1-3.1 3.4 0 5.5 3.3 4.3 6.6-1.8 4.9-9.4 9.4-9.4 9.4z"/></svg>
      <span class="dot" id="act-dot" hidden></span>
    </button>
    </div>
  </header>
  <div id="status" class="status" role="status" hidden></div>
  <main>
    <section id="v-home" class="view" aria-label="홈">
      <div class="stories" id="stories"></div>
      <div id="dday"></div>
      <div id="petcard"></div>
      <div id="attcard"></div>
      <div id="feed-empty"></div>
      <div id="feed" class="feed"></div>
      <div id="feed-end"></div>
    </section>

    <section id="v-question" class="view" aria-label="오늘의 질문" hidden>
      <div class="q-wrap">
        <div class="q-date" id="q-date"></div>
        <article class="q-card">
          <div class="eyebrow" id="q-no"></div>
          <h2 class="q-text" id="q-text"></h2>
        </article>
        <div id="q-mine"></div>
        <div id="q-partner" style="display:grid;gap:14px"></div>
        <div id="q-myq"></div>
        <h3 class="sec-title">지난 질문</h3>
        <div id="q-history"></div>
      </div>
    </section>

    <section id="v-new" class="view" aria-label="새 게시물" hidden>
      <div class="new-wrap">
        <h2 class="view-title" id="new-title">새 게시물</h2>
        <div class="seg" role="tablist" aria-label="올릴 곳"><button type="button" role="tab" data-act="new-mode" data-mode="post" id="nm-post">게시물</button><button type="button" role="tab" data-act="new-mode" data-mode="story" id="nm-story">스토리</button></div>
        <p id="new-note" class="status" style="margin:0" hidden></p>
        <label class="picker" id="picker" for="file-in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="m21 15-5-5L5 21"/></svg>
          <span id="picker-text">사진 고르기</span>
          <small id="picker-sub">한 번에 10장까지 올릴 수 있어요</small>
        </label>
        <input type="file" id="file-in" accept="image/*" multiple hidden>
        <div id="picked" class="picked"></div>
        <div id="pick-caps"></div>
        <label class="lbl" for="cap-in" id="cap-lbl">문구</label>
        <textarea id="cap-in" maxlength="2200" placeholder="이 사진에 대해 한마디 남겨 보세요"></textarea>
        <button class="btn primary block" id="post-btn" data-act="post" disabled>공유하기</button>
        <p id="new-status" class="hint" aria-live="polite"></p>
      </div>
    </section>

    <section id="v-drawing" class="view" aria-label="오늘의 그림" hidden>
      <div class="d-wrap">
        <div class="q-date" id="d-date"></div>
        <article class="q-card">
          <div class="eyebrow">오늘의 그림 주제</div>
          <h2 class="q-text" id="d-topic"></h2>
        </article>
        <div id="d-studio" class="studio">
          <div class="pad-wrap"><canvas id="pad" aria-label="그림판"></canvas></div>
          <div class="tools" id="tools"></div>
          <div class="row">
            <span id="d-cancel-wrap"></span>
            <button class="btn primary" style="flex:1" id="d-submit" data-act="d-submit">완성! 보여주기</button>
          </div>
          <p class="hint">그림을 올리면 상대의 그림도 볼 수 있어요.</p>
        </div>
        <div id="d-results"></div>
        <h3 class="sec-title">지난 그림</h3>
        <div id="d-history"></div>
      </div>
    </section>

    <section id="v-calendar" class="view" aria-label="달력" hidden>
      <div class="cal-wrap" id="cal"></div>
    </section>

    <section id="v-rabbit" class="view" aria-label="토끼" hidden><div class="pet-wrap" id="pet"></div></section>
    <section id="v-pfeed" class="view" aria-label="게시물" hidden><div class="set-head pf-head" id="pf-head"></div><div class="feed" id="pfeed"></div></section>
    <section id="v-settings" class="view" aria-label="설정" hidden><div class="set-wrap" id="settings"></div></section>
    <section id="v-letters" class="view" aria-label="편지함" hidden>
      <div class="lt-wrap" id="letters"></div>
    </section>

    <section id="v-profile" class="view" aria-label="프로필" hidden>
      <div id="prof"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="메뉴">
    <a href="#home" data-nav="home" aria-label="홈"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6.5H9V21H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#question" data-nav="question" aria-label="오늘의 질문"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5a2 2 0 0 1-2 2H8.5L4 21V5.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/><path d="M10.2 8.6a2 2 0 1 1 2.8 1.9c-.6.3-1 .8-1 1.4v.4"/><circle cx="12" cy="14.7" r=".5" fill="currentColor"/></svg></a>
    <a href="#new" data-nav="new" aria-label="새 게시물"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5.5"/><path d="M12 8v8M8 12h8"/></svg></a>
    <a href="#drawing" data-nav="drawing" aria-label="오늘의 그림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8.5"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.5 18.5l-4 1 1-4z"/></svg></a>
    <a href="#profile" data-nav="profile" aria-label="내 프로필"><span id="nav-av"></span></a>
  </nav>
</div>

<div id="overlay" class="overlay" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="confirm" class="overlay center" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="cf-msg">
    <p id="cf-msg"></p>
    <div class="row"><button id="cf-cancel" type="button">취소</button><button id="cf-ok" type="button" class="danger">확인</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="사진 보기" hidden>
  <div class="vw-bg" id="vw-bg"></div>
  <div class="vw-card" id="vw-card">
  <div class="vw-stage" id="vw-stage"><img id="vw-img" alt="" draggable="false"></div>
  <div class="vw-bars" id="vw-bars"></div>
  <div class="vw-head"><span id="vw-who" style="display:flex;align-items:center;gap:8px;min-width:0"></span><span class="vw-sp"></span><span id="vw-tools"></span><button class="ic" type="button" data-act="vw-close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="vw-foot" id="vw-foot"></div>
  </div>
</div>
<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.6-4.5-9.4-9.4C1.4 7.6 3.5 4.3 6.9 4.3c2.2 0 3.7 1.3 5.1 3.1 1.4-1.8 2.9-3.1 5.1-3.1 3.4 0 5.5 3.3 4.3 6.6-1.8 4.9-9.4 9.4-9.4 9.4z"/></svg></div>
<div class="mention-pop" id="mention-pop" role="listbox" aria-label="언급할 사람" hidden></div>
<div class="pet-up" id="pet-up" role="dialog" aria-modal="true" aria-label="토끼가 자랐어요" hidden><div class="pet-up-in" id="pet-up-in"></div></div>
<div id="editor" class="ed" role="dialog" aria-modal="true" aria-label="사진 편집" hidden>
  <div class="ed-top">
    <button class="ed-ic" type="button" data-ed="cancel" aria-label="편집 그만하기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="ed-nav" id="ed-nav"></div>
    <button class="ed-ic" type="button" data-ed="undo" id="ed-undo" aria-label="되돌리기" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ed-done" type="button" data-ed="done" id="ed-done">완료</button>
  </div>
  <div class="ed-stage" id="ed-stage">
    <canvas id="ed-cv" aria-label="편집 중인 사진"></canvas>
    <div class="ed-hint" id="ed-hint" hidden></div>
    <div class="ed-load" id="ed-load">사진 불러오는 중…</div>
    <div class="ed-trash" id="ed-trash" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></div>
  </div>
  <div class="ed-panel" id="ed-panel"></div>
  <div class="ed-tools" id="ed-tools"></div>
  <div class="ed-type" id="ed-type" hidden>
    <div class="ed-type-top"><button class="ed-ic tstyle s0" type="button" id="ed-tstyle" data-ed="txt-style" aria-label="글자 배경 바꾸기"><b>A</b></button><div class="ed-fonts" id="ed-fonts"></div><button class="ed-done" type="button" data-ed="txt-done">완료</button></div>
    <div class="ed-colors" id="ed-tcolors"></div>
    <div class="ed-type-mid"><textarea id="ed-ta" rows="1" maxlength="200" placeholder="글자를 입력해요" aria-label="사진에 넣을 글자" autocomplete="off" autocorrect="off" spellcheck="false"></textarea></div>
  </div>

  return { blob, w, h };
}

function fillCard(el, parts) {

  patch(el.children[0], parts.top); patch(el.children[1], parts.media); patch(el.children[2], parts.body);

function reconcile(container, items) {
  const existing = new Map();
  for (const el of Array.from(container.children)) { if (el.dataset.key) existing.set(el.dataset.key, el); else el.remove(); }
  let prev = null;
  for (const it of items) {
    let el = existing.get(it.key);
    if (el) existing.delete(it.key);
    else { el = document.createElement('article'); el.className = 'card'; el.dataset.key = it.key; }
    fillCard(el, it.parts);
    const want = prev ? prev.nextSibling : container.firstChild;
    if (want !== el) container.insertBefore(el, want);
    prev = el;
  }
  existing.forEach(el => el.remove());
}

/* ---------- activity ---------- */
function activityItems() {
  const me = S.myId; if (!me) return [];
  const mineP = new Set(S.posts.filter(p => p.author === me).map(p => p.id));
  const it = [];
  const myStory = new Set(S.stories.filter(x => x.author === me).map(x => x.id)), cById = {};
  for (const c of S.comments) cById[c.id] = c;
  for (const l of S.likes) if (l.uid !== me && mineP.has(l.postId)) it.push({ at: l.createdAt, uid: l.uid, kind: 'like', postId: l.postId });
  for (const c of S.comments) {
    if (c.uid === me) continue;
    const par = c.parentId && cById[c.parentId];
    if ((c.mentions || []).includes(me)) it.push({ at: c.createdAt, uid: c.uid, kind: 'mention', postId: c.postId, storyId: c.storyId, text: c.text });
    else if (par && (par.uid === me || c.replyTo === me)) it.push({ at: c.createdAt, uid: c.uid, kind: 'reply', postId: c.postId, storyId: c.storyId, text: c.text });
    else if (c.postId && mineP.has(c.postId)) it.push({ at: c.createdAt, uid: c.uid, kind: 'comment', postId: c.postId, text: c.text });
    else if (c.storyId && (myStory.has(c.storyId) || c.storyAuthor === me)) it.push({ at: c.createdAt, uid: c.uid, kind: 'storycomment', storyId: c.storyId, text: c.text });
  }
  for (const l of S.storylikes) if (l.uid !== me && (myStory.has(l.storyId) || l.author === me)) it.push({ at: l.createdAt, uid: l.uid, kind: 'storylike', storyId: l.storyId });
  for (const r of S.reposts) if (r.uid !== me && mineP.has(r.postId)) it.push({ at: r.createdAt, uid: r.uid, kind: 'repost', postId: r.postId });
  for (const p of S.posts) if (p.author !== me) it.push({ at: p.createdAt, uid: p.author, kind: (p.mentions || []).includes(me) ? 'mentionpost' : 'post', postId: p.id });
  for (const a of S.answers) if (a.uid !== me && a.src !== 'someone') it.push({ at: a.createdAt, uid: a.uid, kind: 'answer', date: a.date });
  for (const d of S.drawings) if (d.uid !== me && d.src !== 'someone') it.push({ at: d.updatedAt || d.createdAt, uid: d.uid, kind: 'drawing', date: d.date });
  for (const x of S.stories) if (x.author !== me) it.push({ at: x.createdAt, uid: x.author, kind: (x.mentions || []).includes(me) ? 'mentionstory' : 'story', storyId: x.id });
  for (const l of S.letters) if (l.to === me) it.push({ at: l.createdAt, uid: l.author, kind: 'letter', date: l.openAt, stage: l.openStage });
  for (const pl of S.plans) if (pl.author !== me) it.push({ at: pl.createdAt, uid: pl.author, kind: 'plan', date: pl.date, text: pl.title });
  return it.filter(x => x.at).sort((a, b) => b.at - a.at).slice(0, 60);
}

/* ---------- shared helpers for the newer features ---------- */
const DAY_MS = 86400000;
const weekdayOf = key => { const [y, m, d] = key.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const addDays = (key, n) => new Date((dayNum(key) + n) * DAY_MS).toISOString().slice(0, 10);
const mdKo = key => { const [, m, d] = key.split('-').map(Number); return `${m}월 ${d}일`; };
const ymdKo = key => { const [y, m, d] = key.split('-').map(Number); return `${y}.${m}.${d}`; };
const stripId = (o, extra) => { const c = Object.assign({}, o || {}, extra || {}); delete c.id; return c; };
function hashStr(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const ieyo = w => { const c = String(w).trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 === 0 ? '예요' : '이에요'; };
const couple = () => S.settings.find(x => x.id === 'couple') || {};
function bdayKey(bday, year) {
  if (!bday) return null;
  let mmdd = bday.length === 5 ? bday : bday.slice(5);
  if (mmdd === '02-29' && !((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0)) mmdd = '02-28';
  return `${year}-${mmdd}`;
}

/* ---------- Friday: our own questions ---------- */
function questionInfo(key) {
  const o = IDX.dayq && IDX.dayq[key];
  if (o && o.q) return { text: o.q, custom: false, someone: true, n: o.n };
  if (weekdayOf(key) === 5) {
    const q = S.myquestions.find(x => x.usedOn === key);
    if (q) return { text: q.text, custom: true, author: q.author };
  }
  return { text: questionFor(key), custom: false };
}
let fridayBusy = false;
async function ensureFriday() {
  const t = todayKey();
  if (weekdayOf(t) !== 5 || fridayBusy || !S.loaded.myquestions || !S.db || !S.canWrite || S.mode !== 'live') return;
  if (S.myquestions.some(q => q.usedOn === t)) return;
  const next = S.myquestions.filter(q => !q.usedOn).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))[0];
  if (!next) return;
  fridayBusy = true;
  try { await S.db.doc('myquestions/' + next.id).set(stripId(next, { usedOn: t })); } catch (e) { console.warn('[ours] friday question', e); }
  finally { fridayBusy = false; }
}

/* ---------- D-day, anniversaries, plans ---------- */
function ddayN(key) { const s = couple().startDate; if (!s || key < s) return null; return dayNum(key) - dayNum(s) + 1; }
function eventsOn(key) {
  const out = [];
  const s = couple().startDate;
  if (s && key >= s) {
    const n = dayNum(key) - dayNum(s) + 1;
    if (n === 1) out.push({ kind: 'anniv', title: '우리가 시작한 날' });
    if (n > 1 && n % 100 === 0) out.push({ kind: 'anniv', title: `${n}일` });
    const yrs = Number(key.slice(0, 4)) - Number(s.slice(0, 4));
    if (yrs > 0 && key.slice(5) === s.slice(5)) out.push({ kind: 'anniv', title: `${yrs}주년` });
  }
  for (const p of S.profiles) if (p.birthday && bdayKey(p.birthday, Number(key.slice(0, 4))) === key) out.push({ kind: 'bday', title: `${p.nickname || '상대'} 생일`, uid: p.uid });
  for (const a of S.anniversaries) {
    if (!a.date) continue;
    if (a.date === key) out.push({ kind: 'custom', title: a.title, ref: a.id });
    else if (a.yearly && key > a.date && key.slice(5) === a.date.slice(5)) out.push({ kind: 'custom', title: `${a.title} ${Number(key.slice(0, 4)) - Number(a.date.slice(0, 4))}주년`, ref: a.id });
  }
  for (const p of S.plans) if (p.date === key) out.push({ kind: 'plan', title: p.title, ref: p.id, time: p.time, place: p.place, memo: p.memo, author: p.author });
  for (const l of S.letters) if (l.openAt === key && (l.to === S.myId || l.author === S.myId)) out.push({ kind: 'letter', title: l.to === S.myId ? `${nameOf(l.author)}의 편지가 열리는 날` : '내 편지가 열리는 날', ref: l.id });

function recordView(it) {

/* ---------- push notifications ---------- */
const Push = {
  reg: null, sub: null, busy: false, ready: false,
  supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; },
  vapid() { const c = S.config.find(x => x.id === 'push'); return c && c.vapidPublicKey; },
  async init() {
    if (!('serviceWorker' in navigator)) { this.ready = true; render(); return; }
    try { this.reg = await navigator.serviceWorker.register('sw.js'); } catch (e) { console.warn('[ours] 서비스 워커 등록 실패', e); }
    if (this.reg && 'PushManager' in window) { try { this.sub = await this.reg.pushManager.getSubscription(); } catch (e) { /* ignore */ } }
    this.ready = true;
    if (this.sub && Notification.permission === 'granted') this.save(false);
    render();
  },
  docPath(endpoint) { return 'push/' + safeKey(S.myId) + '__' + hashStr(endpoint); },
  async save(force) {
    if (!this.sub || !S.db || !S.myId) return;
    const j = this.sub.toJSON();
    try { if (!force && Date.now() - Number(localStorage.getItem('ours-push-saved') || 0) < DAY_MS) return; } catch (e) { /* ignore */ }
    const ok = await write(() => S.db.doc(this.docPath(j.endpoint)).set({ uid: S.myId, endpoint: j.endpoint, keys: j.keys, ua: navigator.userAgent.slice(0, 120), updatedAt: Date.now() }));
    if (ok) { try { localStorage.setItem('ours-push-saved', String(Date.now())); } catch (e) { /* ignore */ } }
    return ok;
  },
  async enable() {
    if (this.busy) return; this.busy = true; render();
    try {
      const key = this.vapid();
      if (!key) { toast('알림 서버 설정이 아직 안 됐어요. 업데이트 안내서를 확인해 주세요'); return; }
      if (!this.reg) this.reg = await navigator.serviceWorker.register('sw.js');
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast('알림이 허용되지 않았어요'); return; }
      const raw = atob(key.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - key.length % 4) % 4));
      const appKey = Uint8Array.from(raw, ch => ch.charCodeAt(0));
      this.sub = await this.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: appKey });
      if (await this.save(true)) toast('이제 이 기기로 알림이 와요');
    } catch (e) { console.warn('[ours] 알림 켜기 실패', e); toast('알림을 켜지 못했어요. 잠시 후 다시 해 주세요'); }
    finally { this.busy = false; render(); }
  },
  async disable() {
    if (!this.sub) return;
    const endpoint = this.sub.endpoint;
    try { await this.sub.unsubscribe(); } catch (e) { /* ignore */ }
    this.sub = null;
    await write(() => S.db.doc(this.docPath(endpoint)).delete());
    try { localStorage.removeItem('ours-push-saved'); } catch (e) { /* ignore */ }
    toast('이 기기 알림을 껐어요'); render();
  },
  async test() {
    const ref = S.db.collection('pings').doc();
    const ok = await write(() => ref.set({ uid: S.myId, to: S.myId, createdAt: Date.now() }));
    if (ok) { toast('테스트 알림을 보냈어요. 몇 초 안에 와요'); setTimeout(() => { ref.delete().catch(() => {}); }, 20000); }
  }
};

      case 'push-on': Push.enable(); break;
      case 'push-off': Push.disable(); break;
      case 'push-test': Push.test(); break;
      case 'vw-heart': { const it = Viewer.current(); if (it) toggleStoryLike(it.ref); break; }
      case 'vw-cmts': { const it = Viewer.current(); if (it) { Viewer.paused = true; openSheet('comments', { storyId: it.ref }); } break; }
      case 'vw-share': { const it = Viewer.current(); if (it) { Viewer.paused = true; openSheet('share', { storyId: it.ref }); } break; }
      case 'vw-act': { const it = Viewer.current(); if (it) { Viewer.paused = true; openSheet('storyact', { storyId: it.ref }); } break; }
      case 'story-cmts': openSheet('comments', { storyId: id }); break;
      case 'open-orig': { const o = storyById(id); if (o) { const items = (Date.now() - (o.createdAt || 0) < DAY_MS ? activeStories(o.author) : [o]).map(storyItem); Viewer.open(items, Math.max(0, items.findIndex(y => y.ref === o.id)), { auto: true }); } break; }
      case 'share-post': shareToPost(id); break;
      case 'share-story': shareToStory(id); break;
      case 'share-out': shareOut(id); break;
      case 'reply': setReply(id, t.dataset.uid); break;
      case 'reply-cancel': setReply(null); break;
      case 'prof-av': {
        const u = t.dataset.uid || S.myId;
        if (openStories(u, t.querySelector('.av'))) break;
        if (u === S.myId) { if (!openArchive(u)) toast(S.mode === 'live' && S.canWrite ? '아직 올린 스토리가 없어요. 첫 스토리를 올려 보세요' : '아직 올린 스토리가 없어요'); }
        else toast(`${nameOf(u)}의 새 스토리가 없어요`);
        break;
      }
      case 'theme': setTheme(t.dataset.k); break;
      case 'pet-tab': S.petTab = t.dataset.k; render(); break;
      case 'pet-item': petItem(id); break;
      case 'pet-tap': petTap(); break;
      case 'pet-name': if (S.mode === 'live' && S.canWrite) openSheet('petname'); break;
      case 'pet-up-close': $('#pet-up').hidden = true; break;
      case 'pet-up-letters': $('#pet-up').hidden = true; S.ltTab = 'in'; go('letters'); break;
      case 'lw-mode': { const m = t.dataset.k; $('#lw-mode').value = m; $$('[data-act=lw-mode]').forEach(b => b.classList.toggle('on', b === t)); $('#lw-date-box').hidden = m !== 'date'; $('#lw-pet-box').hidden = m !== 'pet'; break; }
      case 'set-liked': openSheet('liked'); break;
      case 'set-mycmts': openSheet('mycmts'); break;
      case 'set-archive': openSheet('archive'); break;
      case 'set-posts': openSheet('posts'); break;
      case 'replay': openSheet('replay', { date: t.dataset.date, uid: t.dataset.uid }); break;
      case 'rp-play': Replay.toggle(); break;
      case 'duo-play': Duo.toggle(); break;
      case 'att-open': openSheet('attend'); break;
      case 'att-do': attendNow(); break;
      case 'att-pet': closeSheet(true); go('rabbit'); break;
      case 'duo-speed': Duo.cycle(); break;
      case 'rp-again': Replay.restart(); break;
      case 'rp-speed': Replay.cycle(); break;
      case 'set-import': if (S.imp.st === 'done') S.imp = { st: 'idle' }; openSheet('someone'); break;
      case 'imp-dates': S.imp.showDates = !S.imp.showDates; render(); break;
      case 'imp-run': runImport(); break;
      case 'imp-again': S.imp = { st: 'idle' }; render(); break;
      case 'arch-open': closeSheet(true); openArchive(S.myId, id); break;
      case 'post-edit': openSheet('postedit', { postId: id, from: 'posts' }); break;
      case 'act-go': {
        const k = t.dataset.kind;
        if (k === 'storylike') { closeSheet(true); if (!openArchive(S.myId, t.dataset.sid)) toast('지워진 스토리예요'); break; }
        if (k === 'storycomment' || (k === 'reply' && t.dataset.sid)) { openSheet('comments', { storyId: t.dataset.sid }); break; }
        if (k === 'reply' || k === 'mention') { if (t.dataset.sid) openSheet('comments', { storyId: t.dataset.sid }); else openSheet('comments', { postId: id }); break; }
        if (k === 'mentionstory') { closeSheet(true); const sx = storyById(t.dataset.sid); if (sx) { const items = (Date.now() - (sx.createdAt || 0) < DAY_MS ? activeStories(sx.author) : [sx]).map(storyItem); Viewer.open(items, Math.max(0, items.findIndex(y => y.ref === sx.id)), { auto: true }); } else toast('지워진 스토리예요'); break; }
        if (k === 'answer') { closeSheet(true); S.qDate = t.dataset.date; go('question'); }
        else if (k === 'drawing') { closeSheet(true); S.dDate = t.dataset.date; S.dRedraw = false; go('drawing'); }
        else if (k === 'story') { closeSheet(true); if (!openStories(t.dataset.uid)) { S.profileUid = t.dataset.uid; go('profile'); } }
        else if (k === 'letter') { closeSheet(true); S.ltTab = 'in'; go('letters'); }
        else if (k === 'plan') { closeSheet(true); S.calSel = t.dataset.date; S.calMonth = t.dataset.date.slice(0, 7); go('calendar'); }
        else if (id) openSheet('post', { postId: id });
        break;
      }
    }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'cmt-form') sendComment();
    else if (e.target.id === 'vw-reply') sendStoryReply();
    else if (e.target.id === 'pe-form') savePostEdit(e.target);
    else if (e.target.id === 'pn-form') { const v = $('#pn-in').value.trim().slice(0, 12); if (!v) { toast('이름을 적어 주세요'); return; } savePet({ name: v }).then(ok => { if (ok) { closeSheet(true); toast(`우리 토끼 이름은 이제 ${v}${ieyo(v)} ♥`); } }); }
    else if (e.target.id === 'ep-form') saveProfile();
    else if (e.target.id === 'onb-form') saveOnboard();
    else if (e.target.id === 'cp-form') saveCouple();
    else if (e.target.id === 'plan-form') savePlan(e.target);
    else if (e.target.id === 'anniv-form') saveAnniv(e.target);
    else if (e.target.id === 'lw-form') saveLetter(e.target);
    else if (e.target.id === 'myq-form') addMyQ();
    else if (e.target.id === 'hl-form') saveHighlight(e.target);
  });
  document.addEventListener('change', async e => {
    if (e.target.id === 'file-in') { onFilesPicked(Array.from(e.target.files || [])); e.target.value = ''; }
    else if (e.target.dataset && e.target.dataset.lpref) setLpref(e.target.dataset.lpref, e.target.checked);
    else if (e.target.dataset && e.target.dataset.pref) { const k = e.target.dataset.pref; await saveMyProfile({ notify: Object.assign(prefs(), { [k]: e.target.checked }) }); }
    else if (e.target.id === 'np-hour') { await saveMyProfile({ notify: Object.assign(prefs(), { hour: Number(e.target.value) }) }); toast('매일 알림 시간을 바꿨어요'); }
    else if (e.target.id === 'ep-file') {
      const f = (e.target.files || [])[0]; e.target.value = ''; if (!f) return;
      try { const c = await compress(f, 480, 0.88, true); S.pendingAvatar = c.blob; const prev = $('#ep-av-prev'); if (prev) { if (prev._url) URL.revokeObjectURL(prev._url); prev._url = null; } renderSheet(); }
      catch (err) { toast(assetErrMsg(err)); }
    }
  });
  $('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(false, true); });
  document.addEventListener('input', e => { const i = e.target.dataset ? e.target.dataset.pcap : null; if (i != null && picked[Number(i)]) picked[Number(i)].cap = e.target.value; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#confirm').hidden || Viewer.isOpen() || Ed.isOpen()) return; closeSheet(false, true); } });
  document.addEventListener('scroll', e => {
    const c = e.target; if (!(c instanceof Element) || !c.classList.contains('carousel')) return;
    const i = Math.round(c.scrollLeft / Math.max(1, c.clientWidth)); const m = c.parentElement;
    const dots = m.querySelectorAll('.dots i'); dots.forEach((d, j) => d.classList.toggle('on', j === i));
    const b = m.querySelector('.badge'); if (b) b.textContent = (i + 1) + '/' + dots.length;
    const pc = m.nextElementSibling;
    if (pc && pc.classList.contains('pcap')) { const sl = c.children[i], tx = (sl && sl.dataset.cap) || ''; pc.querySelector('.pc-t').innerHTML = rich(tx); pc.querySelector('.pc-n').textContent = (i + 1) + '/' + dots.length; pc.classList.toggle('empty', !tx); }
  }, true);
  document.addEventListener('error', e => {
    const t = e.target; if (!t || t.tagName !== 'IMG') return;
    const box = t.closest('.slide, .tile, .av-in, .dimg, .thumb, .h-thumbs span'); if (box) box.classList.add('broken');
  }, true);
  let lastTap = { t: 0, id: null, x: 0, y: 0 };
  document.addEventListener('pointerup', e => {
    const m = e.target.closest && e.target.closest('.media'); if (!m || e.target.closest('button')) return;
    const now = Date.now(), id = m.dataset.id;
    if (lastTap.id === id && now - lastTap.t < 330 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
      lastTap = { t: 0, id: null, x: 0, y: 0 };
      const b = m.querySelector('.burst'); if (b) { b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }
      toggleLike(id, true);
    } else lastTap = { t: now, id, x: e.clientX, y: e.clientY };
  });
  const drop = $('#picker');
  drop.addEventListener('dragover', e => { e.preventDefault(); });
  drop.addEventListener('drop', e => { e.preventDefault(); onFilesPicked(Array.from((e.dataTransfer && e.dataTransfer.files) || [])); });
  setInterval(() => { if (todayKey() !== S._today) { S._today = todayKey(); S._lbRefresh = 0; ensureFriday(); render(); } }, 60000);
}
function syncTools() {
  $$('[data-act="tool-color"]').forEach(b => { const on = b.dataset.c === Draw.color && !Draw.erase; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  $$('[data-act="tool-size"]').forEach(b => { const on = Number(b.dataset.z) === Draw.size; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const er = $('[data-act="tool-erase"]'); er.classList.toggle('on', Draw.erase); er.setAttribute('aria-pressed', Draw.erase);
}

/* ---------- data ---------- */
function refreshPeople() {
  if (!S.user || !S.user.profiles) return;
  const ids = [...new Set([S.myId, ...S.profiles.map(p => p.uid), ...S.posts.map(p => p.author)])].filter(x => x && !String(x).startsWith('local-')).sort();
  const k = ids.join('|'); if (!ids.length || k === S._ppKey) return; S._ppKey = k;
  S.user.profiles(ids).then(r => { S.pp = r || {}; render(); }).catch(() => {});
}
function sub(name, q) {
  S.loaded[name] = false;
  const timer = setTimeout(() => { if (!S.loaded[name]) { S.slow = true; render(); } }, 10000);
  try {
    q.onSnapshot(snap => {
      S[name] = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      if (!snap.metadata || !snap.metadata.fromCache) { S.loaded[name] = true; clearTimeout(timer); if (Object.values(S.loaded).every(Boolean)) S.slow = false; }
      if (name === 'profiles' || name === 'posts') refreshPeople();
      if (name === 'myquestions') ensureFriday();
      render();
    }, err => {
      clearTimeout(timer); S.loaded[name] = true;
      if (err && err.code === 'revoked') S.mode = 'revoked'; else S.error = err;
      console.warn('[ours] listener', name, err); render();
    });
  } catch (e) { clearTimeout(timer); S.loaded[name] = true; S.error = e; console.warn(e); }
}
function localId() {
  try { let v = localStorage.getItem('ours-local-id'); if (!v) { v = 'local-' + Math.random().toString(36).slice(2, 12); localStorage.setItem('ours-local-id', v); } return v; }
  catch (e) { return 'local-' + Math.random().toString(36).slice(2, 12); }
}
function askLogin() {
  return new Promise(resolve => {
    const box = $('#login'), form = $('#login-form'), err = $('#lg-err'), btn = $('#lg-btn');
    box.hidden = false; document.body.classList.add('locked');
    setTimeout(() => { const e = $('#lg-email'); if (e && window.matchMedia('(hover:hover)').matches) e.focus(); }, 60);
    form.onsubmit = async ev => {
      ev.preventDefault();
      const mail = $('#lg-email').value.trim(), pw = $('#lg-pw').value;
      if (!mail || !pw) { err.textContent = '이메일과 비밀번호를 적어 주세요.'; return; }
      err.textContent = ''; btn.disabled = true; btn.textContent = '로그인 중…';
      try {
        const session = await window.OursBackend.signIn(mail, pw);
        box.hidden = true; document.body.classList.remove('locked'); resolve(session);
      } catch (x) { err.textContent = x.message || '로그인하지 못했어요.'; }
      finally { btn.disabled = false; btn.textContent = '로그인'; }
    };
  });
}
async function boot() {
  applyTheme();
  S.qDate = todayKey(); S.dDate = todayKey(); S._today = todayKey();
  Draw.init(); bind(); bindViewer(); bindSheetDrag(); bindEdgeBack(); bindPullRefresh(); bindMentions();
  const h = location.hash.replace('#', ''); S.view = VIEWS.includes(h) ? h : 'home'; showView();
  renderPicked(); doRender();
  const B = window.OursBackend;
  if (!B || !B.configured) { S.mode = 'preview'; render(); return; }
  B.onPhotosReady(render);
  let session = null;
  try { session = await B.session(); } catch (e) { console.warn('[ours]', e); }
  if (!session) session = await askLogin();
  const c = B.connect(session);
  const [db, user, assets] = await Promise.all([c.use('db'), c.use('user'), c.use('assets')]);
  S.db = db; S.user = user; S.assets = assets;
  const me = await user.me(); S.myId = me.id; S.myName = me.name || '';
  S.canWrite = true; S.canWriteKnown = true;
  if ((await B.isMember()) === false) { S.canWrite = false; S.notMember = true; }
  S.lastSeen = getSeen();
  S.mode = 'live';
  sub('profiles', db.collection('profiles'));
  sub('posts', db.collection('posts').orderBy('createdAt', 'desc').limit(500));
  sub('likes', db.collection('likes').orderBy('createdAt', 'desc').limit(1000));
  sub('comments', db.collection('comments').orderBy('createdAt', 'desc').limit(1000));
  sub('reposts', db.collection('reposts').orderBy('createdAt', 'desc').limit(500));
  sub('answers', db.collection('answers').orderBy('createdAt', 'desc').limit(1000));
  sub('drawings', db.collection('drawings').orderBy('createdAt', 'desc').limit(500));
  sub('stories', db.collection('stories').orderBy('createdAt', 'desc').limit(500));
  for (const c of ['highlights', 'letters', 'letterbodies', 'plans', 'anniversaries', 'myquestions', 'settings', 'config', 'storyviews', 'storylikes', 'petbuys', 'dayq', 'attend']) sub(c, db.collection(c));
  refreshPeople(); render();
  Push.init();
}
boot();
})();
