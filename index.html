<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#000000">
<script>try{var t=localStorage.getItem('ours-theme')||'dark';if(t==='light'||(t==='auto'&&matchMedia('(prefers-color-scheme: light)').matches)){document.documentElement.dataset.theme='light';document.querySelector('meta[name=theme-color]').setAttribute('content','#f7f4f6');}else document.documentElement.dataset.theme='dark';}catch(e){}</script>
<title>ours</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ours">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Gaegu&family=Gowun+Dodum&family=Grand+Hotel&family=Hi+Melody&family=Jua&family=Nanum+Pen+Script&family=Poor+Story&family=Single+Day&display=swap" rel="stylesheet">
<style>
:root{
  /* ours v4: Apple-like and minimal. Black (or soft white) canvas, flat surfaces with hairlines, one pink accent.
     Jua for the app's own words, Gowun Dodum for small print, each person's handwriting for what they write. */
  --fg:255,255,255;
  --bg:#000;
  --bg-art:radial-gradient(130% 52% at 50% -14%,rgba(255,79,154,.17),transparent 62%),radial-gradient(80% 36% at 100% 104%,rgba(255,79,154,.07),transparent 70%),#000;
  --surface:#131113;
  --surface-2:#1d1a1c;
  --sheet:#151315;
  --bar:rgba(12,10,12,.74);
  --field:rgba(255,255,255,.07);
  --text:#f7f3f5;
  --muted:#9d9399;
  --pink:#ff4f9a;
  --pink-soft:#ff9cc6;
  --pink-ink:#2a0716;
  --line:rgba(255,255,255,.09);
  --glass:linear-gradient(transparent,transparent);
  --glass-base:var(--surface);
  --hi:inset 0 1px 0 rgba(255,255,255,.045);
  --drop:0 1px 2px rgba(0,0,0,.35);
  --grad:linear-gradient(45deg,#ff2d86 0%,#ff5fa6 45%,#ffb3d4 100%);
  --candy:linear-gradient(180deg,#ff67a9 0%,#ff3d8e 100%);
  --candy-hi:0 6px 18px rgba(255,61,142,.28);
  --media-bg:#0c0b0c;
  --av-bg:linear-gradient(160deg,#3b2531,#1a1016);
  --seen-ring:#3b3438;
  --toast-bg:#fff;
  --toast-fg:#1b1016;
  --font-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-cute:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --font-logo:"Grand Hotel","Jua",cursive;
  --font-hand:"Nanum Pen Script","Jua",cursive;
  --col:470px;
  color-scheme:dark;
}
:root[data-theme=light]{
  --fg:22,14,18;
  --bg:#f7f4f6;
  --bg-art:radial-gradient(130% 52% at 50% -14%,rgba(255,79,154,.13),transparent 62%),radial-gradient(80% 36% at 100% 104%,rgba(255,79,154,.06),transparent 70%),#f7f4f6;
  --surface:#ffffff;
  --surface-2:#f3eff1;
  --sheet:#ffffff;
  --bar:rgba(250,248,249,.8);
  --field:rgba(22,14,18,.055);
  --text:#121013;
  --muted:#857a80;
  --pink:#ff2f87;
  --pink-soft:#e2307c;
  --line:rgba(22,14,18,.09);
  --hi:0 0 0 0 transparent;
  --drop:0 1px 2px rgba(22,14,18,.04),0 8px 24px rgba(22,14,18,.05);
  --candy-hi:0 6px 16px rgba(255,47,135,.25);
  --media-bg:#ebe6e9;
  --av-bg:linear-gradient(160deg,#ffe1ee,#ffbcd9);
  --seen-ring:#d8cfd4;
  --toast-bg:#1c1a1c;
  --toast-fg:#fff;
  color-scheme:light;
}
/* photos, the full-screen viewer and the editor always stay dark */
.viewer,.ed{--fg:255,255,255;--text:#fff;--muted:rgba(255,255,255,.72);--surface:#161416;--surface-2:#1f1c1e;--field:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--glass-base:rgba(0,0,0,.45);--hi:inset 0 1px 0 rgba(255,255,255,.06);--pink:#ff4f9a;--pink-soft:#ff9cc6;color:#fff;color-scheme:dark}
.media,.tile,.pk,.strip button,.pick-grid button,.sa-thumb,.thumb{--fg:255,255,255}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;min-height:100%;color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
body{background:transparent}
/* the glossy black: a cool sheen band, a light reflection from the top-left, a pink glow from below */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg-art)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:var(--text)}
img{max-width:100%;display:block}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
b,strong,.btn,.link,.pill,.chip,.eyebrow,.sec-title,.view-title,.who,.prof-name,.stats,.sh-head h2,.story .lbl,.act,.ptabs button,.t-cta,.pk-first,.dcard figcaption,label.lbl,.toast,.badge,.picker,.fp small,.dialog p,.repost-line,.h-date{font-family:var(--font-cute);font-weight:400}
.app{max-width:var(--col);margin:0 auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:480px){.app{border:0}}

/* photo editor */
.ed{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ed button{touch-action:manipulation}
.ed-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 6px}
.ed-ic{width:42px;height:42px;flex:none;border-radius:50%;display:inline-grid;place-items:center;background:rgba(var(--fg),.08);border:1px solid rgba(var(--fg),.12);box-shadow:var(--hi);color:#fff}
.ed-ic svg{width:21px;height:21px}
.ed-ic.sm{width:34px;height:34px}
.ed-ic.sm svg{width:18px;height:18px}
.ed-ic:disabled{opacity:.3}
.ed-done{flex:none;height:40px;padding:0 18px;border-radius:999px;background:var(--candy);box-shadow:var(--candy-hi);border:1px solid rgba(255,150,195,.55);font-family:var(--font-cute);font-size:16px;color:#fff;text-shadow:0 1px 1px rgba(120,0,50,.4)}
.ed-nav{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-cute);font-size:15px;font-variant-numeric:tabular-nums}
.ed-stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;touch-action:none;overflow:hidden}
#ed-cv{display:block;border-radius:14px;box-shadow:0 0 0 1px rgba(var(--fg),.1),0 14px 44px rgba(255,79,154,.14);touch-action:none;background:#111}
.ed-load{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-cute);color:var(--muted)}
.ed-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--font-cute);font-size:13px;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.ed-trash{position:absolute;left:50%;bottom:16px;width:56px;height:56px;margin-left:-28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);border:1.5px solid rgba(var(--fg),.65);transition:transform .15s,background .15s;pointer-events:none}
.ed-trash svg{width:24px;height:24px}
.ed-trash.hot{transform:scale(1.22);background:#e63946;border-color:#fff}
.ed-panel{padding:8px 12px 2px;display:grid;gap:10px}
.ed-panel:empty{display:none}
.ed-row{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.ed-row::-webkit-scrollbar,.ed-filters::-webkit-scrollbar,.ed-fonts::-webkit-scrollbar,.ed-colors::-webkit-scrollbar{display:none}
.ed-sp{flex:1}
.ed-lbl{flex:none;font-family:var(--font-cute);font-size:13.5px;color:var(--muted)}
.ed-chip{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1px solid rgba(var(--fg),.16);background:rgba(var(--fg),.05);font-family:var(--font-cute);font-size:14.5px;display:inline-flex;align-items:center;gap:5px;color:#fff}
.ed-chip.on{border-color:var(--pink);color:var(--pink);background:rgba(255,79,154,.12)}
.ed-chip svg{width:17px;height:17px}
.ed-dot{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid rgba(var(--fg),.85);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.ed-dot.on{outline:2.5px solid var(--pink);outline-offset:2px}
.ed-size{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(var(--fg),.16);background:rgba(var(--fg),.05)}
.ed-size i{display:block;border-radius:50%;background:#fff}
.ed-size.on{border-color:var(--pink)}
.ed-size.on i{background:var(--pink)}
.ed-filters{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
.ed-filters button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--font-cute);font-size:12.5px;color:rgba(var(--fg),.8)}
.ed-filters img{width:62px;height:62px;border-radius:13px;object-fit:cover;border:2px solid transparent;background:#222}
.ed-filters button.on{color:var(--pink)}
.ed-filters button.on img{border-color:var(--pink)}
.ed-sl{display:grid;grid-template-columns:56px 1fr 38px;align-items:center;gap:8px;font-family:var(--font-cute);font-size:14px}
.ed-sl output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.ed input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;padding:0;border:0;box-shadow:none}
.ed input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(var(--fg),.22)}
.ed input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,79,154,.55),0 2px 6px rgba(0,0,0,.5)}
.ed input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(var(--fg),.22)}
.ed input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,79,154,.55)}
.ed-tools{display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(var(--fg),.08);margin-top:6px}
.ed-tools button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:50px;padding:6px 4px;border-radius:12px;font-family:var(--font-cute);font-size:12px;color:rgba(var(--fg),.78)}
.ed-tools button svg{width:24px;height:24px}
.ed-tools button.on{color:var(--pink);background:rgba(255,79,154,.12)}
.ed.typing .ed-top,.ed.typing .ed-tools,.ed.typing .ed-panel{visibility:hidden}
.ed-type{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.66);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ed-type-top{display:flex;align-items:center;gap:8px;padding:8px 12px}
.ed-fonts{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.ed-fonts button{flex:none;height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(var(--fg),.22);background:rgba(0,0,0,.35);font-size:17px;color:#fff}
.ed-fonts button.on{background:#fff;color:#111}
.ed-colors{display:flex;gap:10px;padding:6px 14px 10px;overflow-x:auto;scrollbar-width:none}
.ed-type-mid{flex:1;display:grid;place-items:center;padding:16px;overflow:auto}
#ed-ta{width:auto;min-width:60%;max-width:min(520px,100%);background:transparent;border:0;outline:0;resize:none;text-align:center;line-height:1.22;color:#fff;padding:8px 14px;border-radius:14px;overflow:hidden;caret-color:var(--pink);box-shadow:none;-webkit-user-select:text;user-select:text}
#ed-ta::placeholder{color:rgba(var(--fg),.55)}
.tstyle b{font-family:var(--font-cute);font-weight:400;font-size:19px;line-height:1;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px}
.tstyle.s1 b{background:#fff;color:#111}
.tstyle.s2 b{border:2px solid #fff}
.tstyle.s3 b{color:#fff;background:rgba(255,255,255,.28);text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 0 2px #000}
.ed-stk{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.ed-stk-in{width:100%;max-height:74%;overflow-y:auto;background:linear-gradient(180deg,rgba(44,35,40,.98),rgba(18,14,16,.99));border-radius:22px 22px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(var(--fg),.14);box-shadow:var(--hi)}
.ed-stk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ed-stk-head b{font-size:17px}
.ed-stk-sp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ed-stk-sp .pill{height:auto;padding:7px 15px;border-radius:999px;background:#fff;color:#ff4f9a;font-family:var(--font-cute);font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.35);text-shadow:none}
.ed-stk-sp .ours{font-family:var(--font-logo);font-size:32px;line-height:1.1;padding:0 10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ed-stk-em{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:4px}
.ed-stk-em button{font-size:34px;height:54px;border-radius:12px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ed-stk-em button:active{background:rgba(var(--fg),.1)}
.pk .pk-img{display:block;width:100%;height:100%;padding:0}
.pk .pk-ed{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.72);display:grid;place-items:center;pointer-events:none}
.pk .pk-ed svg{width:13px;height:13px}
.pk .pk-ed.on{background:var(--candy);box-shadow:0 2px 6px rgba(255,79,154,.5)}

/* handwriting: each person's own font for what they write */
.hw{font-family:var(--hw-font),"Gowun Dodum",sans-serif;font-size:calc(var(--hw-base,16px) * var(--hw-k,1.15));line-height:1.36;letter-spacing:var(--hw-ls,0)}
.f-himelody{--hw-font:"Hi Melody";--hw-k:1.22}
.f-gamja{--hw-font:"Gamja Flower";--hw-k:1.16}
.f-poor{--hw-font:"Poor Story";--hw-k:1.08}
.f-gaegu{--hw-font:"Gaegu";--hw-k:1.2;--hw-ls:-.03em}
.f-single{--hw-font:"Single Day";--hw-k:1.06}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 8px 0 16px;background:linear-gradient(180deg,rgba(34,29,33,.72),rgba(8,6,8,.58));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(var(--fg),.07)}
.logo{font-family:var(--font-logo);font-size:36px;line-height:1;text-decoration:none;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 4px 0 0;letter-spacing:.01em;filter:drop-shadow(0 0 14px rgba(255,79,154,.35))}
.logo.big{font-size:64px}
.ic{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;position:relative}
.ic svg{width:26px;height:26px}
.ic.sm svg{width:20px;height:20px}
.dot{position:absolute;top:9px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px #000,0 0 8px rgba(255,79,154,.8)}
.status{margin:10px 16px 0;padding:10px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,79,154,.16),rgba(255,79,154,.06));border:1px solid rgba(255,120,180,.28);box-shadow:var(--hi);color:var(--pink-soft);font-size:13.5px}
main{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

/* bottom tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--col);display:grid;grid-template-columns:repeat(5,1fr);height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,rgba(34,29,33,.74),rgba(6,5,6,.86));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-top:1px solid rgba(var(--fg),.1);box-shadow:inset 0 1px 0 rgba(var(--fg),.08);z-index:20}
.tabs a{display:grid;place-items:center;color:var(--muted);text-decoration:none}
.tabs a svg{width:26px;height:26px}
.tabs a.on{color:var(--text)}
.tabs a.on svg{stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(var(--fg),.35))}
.tabs a[data-nav="new"].on{color:var(--pink)}
.tabs a[data-nav="new"].on svg{filter:drop-shadow(0 0 8px rgba(255,79,154,.7))}
.tabs a.on .av{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--text)}

/* avatars */
.av{--s:32px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;position:relative}
.av.ring{background:var(--grad);padding:2.5px;box-shadow:0 0 14px rgba(255,79,154,.25)}
.av.ring.seen{background:linear-gradient(180deg,#5a4b52,#2a2226);box-shadow:none}
.av-in{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 34% 24%,rgba(var(--fg),.28),rgba(var(--fg),0) 46%),linear-gradient(160deg,#4a2a3a,#1c1016);color:var(--pink-soft);font-family:var(--font-cute);font-size:calc(var(--s)*.42);line-height:1;box-shadow:inset 0 1px 0 rgba(var(--fg),.2)}
.av.ring .av-in{border:2.5px solid #000}
.av-in img{width:100%;height:100%;object-fit:cover}
.qbubble{font-family:var(--font-hand);font-size:38px;color:var(--pink);padding-top:4px;background:radial-gradient(circle at 34% 24%,rgba(var(--fg),.26),rgba(var(--fg),0) 46%),linear-gradient(160deg,#3a1526,#160910)}
.qbubble svg{width:26px;height:26px;color:var(--pink)}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none}
.story .lbl{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}

/* feed cards */
.card{border-bottom:1px solid var(--line);padding-bottom:14px}
.repost-line{display:flex;align-items:center;gap:6px;padding:12px 16px 0;color:var(--muted);font-size:13px}
.repost-line svg{width:15px;height:15px;color:var(--pink);flex:none}
.repost-line b{color:var(--text)}
.repost-note{--hw-base:16px;margin:8px 16px 0;padding:2px 0 2px 12px;border-left:2px solid var(--pink);white-space:pre-wrap}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 10px 14px}
.who{display:flex;align-items:center;gap:10px;font-size:15px;text-align:left}
.media{position:relative;background:#0b0b0b;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;max-height:72vh}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative}
.slide img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.broken{display:grid;place-items:center;min-height:120px}
.broken img{display:none}
.broken::after{content:"사진을 불러오지 못했어요";color:var(--muted);font-size:12.5px;padding:8px;text-align:center}
.av-in.broken::after,.tile.broken::after,.dimg.broken::after{content:""}
.badge{position:absolute;top:12px;right:12px;background:linear-gradient(180deg,rgba(60,52,56,.7),rgba(10,8,9,.7));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(var(--fg),.2);font-size:12.5px;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(var(--fg),.45);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dots i.on{background:var(--pink);box-shadow:0 0 0 1.5px #fff}
.arrow{display:none;position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,#fff,#e9e2e6);box-shadow:0 2px 8px rgba(0,0,0,.4);color:#111;font-size:22px;line-height:1;place-items:center;padding-bottom:3px}
.arrow.prev{left:10px}.arrow.next{right:10px}
@media (hover:hover){.media:hover .arrow{display:grid}}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.burst svg{width:104px;height:104px;color:var(--pink);filter:drop-shadow(0 6px 26px rgba(255,79,154,.65))}
.burst.go{animation:burst .9s ease forwards}
@keyframes burst{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.94)}45%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.actions{display:flex;align-items:center;gap:2px;padding:6px 8px 2px}
.act{display:inline-flex;align-items:center;gap:5px;height:42px;padding:0 8px;border-radius:21px;font-size:14.5px;font-variant-numeric:tabular-nums}
.act svg{width:26px;height:26px}
.act.on{color:var(--pink)}
.act.on svg{filter:drop-shadow(0 0 6px rgba(255,79,154,.55))}
.act.like.on svg{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.28)}}
.c-body p{margin:0}
.likes,.cap,.cmt,.more,.when{padding:0 16px}
.likes{font-size:14px;display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.stack{display:inline-flex}
.stack .av{margin-left:-6px;box-shadow:0 0 0 2px #000}
.stack .av:first-child{margin-left:0}
.cap{--hw-base:16px;white-space:pre-wrap;margin:2px 0}
.cap b,.cmt b{font-size:15px;margin-right:7px}
.more{display:block;color:var(--muted);font-size:14px;margin:4px 0 2px;text-align:left}
.cmt{--hw-base:15.5px;white-space:pre-wrap;margin:1px 0}
.when{display:block;color:var(--muted);font-size:11.5px;margin-top:6px;letter-spacing:.02em}
.feed-end-note{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:28px 0 12px}
.feed-end-note svg{width:22px;height:22px;color:var(--pink);filter:drop-shadow(0 0 8px rgba(255,79,154,.6))}
.empty{color:var(--muted);text-align:center;padding:36px 16px;margin:0}
.empty.sm{padding:18px 8px;font-size:14px}

/* glass surfaces */
.q-card,.ans,.teaser,.history,.dcard,.rp-prev,.note-card,.picker,.fp,.tbtn,.btn.ghost{background:var(--glass),var(--glass-base);border:1px solid rgba(var(--fg),.09);box-shadow:var(--hi),var(--drop);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tbtn,.btn.ghost,.fp{box-shadow:var(--hi)}

/* welcome */
.welcome{padding:26px 16px;display:grid;gap:14px}
.w-hero{text-align:center;display:grid;justify-items:center;gap:6px;padding:8px 0 10px}
.w-hero p{margin:0 0 10px;color:var(--muted)}
.teaser{display:grid;gap:6px;width:100%;text-align:left;border-radius:22px;padding:18px 18px 16px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--pink)}
.hand{font-family:var(--font-hand);font-size:31px;line-height:1.15;color:var(--text);text-wrap:balance}
.t-cta{font-size:14px;color:var(--pink-soft)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:14px;font-size:16px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--candy);color:#fff;text-shadow:0 1px 1px rgba(120,0,50,.4);border:1px solid rgba(255,150,195,.55);box-shadow:var(--candy-hi)}
.btn.primary:active{filter:brightness(.94)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{color:var(--text)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.link{color:var(--pink);font-size:15px}
.link.sm{font-size:13.5px;margin-left:auto}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;background:rgba(var(--fg),.035);border:1px solid rgba(var(--fg),.1);border-radius:16px;padding:12px 14px;outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.45);transition:border-color .2s,box-shadow .2s}
textarea{--hw-base:17px;resize:vertical;min-height:100px;line-height:1.5}
textarea.hw,input.hw{line-height:1.4}
input[type=text],input[type=email],input[type=password]{--hw-base:16px;height:48px}
#cmt-in{height:44px}
textarea:focus,input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{border-color:rgba(255,79,154,.8);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px rgba(255,79,154,.18)}
::placeholder{color:#7d6d75;opacity:1}
label.lbl{font-size:14px;color:var(--muted);margin-bottom:-6px}
.hint{color:var(--muted);font-size:13px;margin:0;min-height:1em}
.view-title{font-size:21px;margin:4px 0 0}

/* question & drawing */
.q-wrap,.d-wrap,.new-wrap{padding:16px;display:grid;gap:14px}
.q-date{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;min-height:28px}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--candy);color:#fff;text-shadow:0 1px 1px rgba(120,0,50,.4);box-shadow:inset 0 1px 0 rgba(var(--fg),.55),0 4px 12px rgba(255,79,154,.3);font-size:13px}
.pill.ghost{background:var(--glass),var(--glass-base);border:1px solid rgba(255,79,154,.7);color:var(--pink);text-shadow:none;box-shadow:var(--hi)}
.q-card{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 26px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,79,154,.32),transparent 60%),var(--glass),var(--glass-base);border-color:rgba(255,140,190,.22)}
.q-card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(158deg,rgba(var(--fg),.17) 0%,rgba(var(--fg),.05) 28%,rgba(var(--fg),0) 46%)}
.q-card .eyebrow{font-variant-numeric:tabular-nums}
.q-text{position:relative;font-family:var(--font-hand);font-weight:400;font-size:42px;line-height:1.1;margin:10px 0 0;text-wrap:balance;color:#fff;text-shadow:0 2px 18px rgba(255,79,154,.25)}
.q-card::after{content:"";position:absolute;right:-18px;bottom:-26px;width:110px;height:110px;background:var(--pink);opacity:.12;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 20.3s-7.6-4.5-9.4-9.4C1.4 7.6 3.5 4.3 6.9 4.3c2.2 0 3.7 1.3 5.1 3.1 1.4-1.8 2.9-3.1 5.1-3.1 3.4 0 5.5 3.3 4.3 6.6-1.8 4.9-9.4 9.4-9.4 9.4z'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 20.3s-7.6-4.5-9.4-9.4C1.4 7.6 3.5 4.3 6.9 4.3c2.2 0 3.7 1.3 5.1 3.1 1.4-1.8 2.9-3.1 5.1-3.1 3.4 0 5.5 3.3 4.3 6.6-1.8 4.9-9.4 9.4-9.4 9.4z'/></svg>") center/contain no-repeat;transform:rotate(-14deg)}
.ans{border-radius:20px;padding:14px 16px;display:grid;gap:10px}
.ans-head{display:flex;align-items:center;gap:8px;font-size:14px}
.ans-head b{font-size:15px}
.ans-head .t{margin-left:auto;color:var(--muted);font-size:12px}
.ans-text{--hw-base:18px;white-space:pre-wrap;margin:0}
.ans.locked .ans-text{filter:blur(5px);user-select:none;color:var(--muted)}
.lock-note{display:flex;align-items:center;gap:6px;color:var(--pink-soft);font-size:13px;margin:0}
.lock-note svg{width:15px;height:15px}
.sec-title{font-size:17px;margin:14px 0 -4px}
.history{display:grid;border-radius:18px;overflow:hidden}
.h-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.h-row:last-child{border-bottom:0}
.h-date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.h-q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid rgba(var(--fg),.12);color:var(--muted);white-space:nowrap;box-shadow:var(--hi)}
.chip.both{border-color:rgba(255,79,154,.8);color:var(--pink)}
.chip.need{background:var(--candy);color:#fff;border-color:rgba(255,150,195,.55);text-shadow:0 1px 1px rgba(120,0,50,.4)}
.h-thumbs{display:flex;gap:4px}
.h-thumbs span{width:34px;height:34px;border-radius:9px;overflow:hidden;background:#fff;display:grid;place-items:center}
.h-thumbs span.no{background:rgba(var(--fg),.03);border:1px dashed rgba(var(--fg),.14)}
.h-thumbs span.lk{background:#1c1016;color:var(--pink-soft)}
.h-thumbs svg{width:14px;height:14px}
.h-thumbs img{width:100%;height:100%;object-fit:cover}

.studio{display:grid;gap:12px}
.pad-wrap{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(var(--fg),.16),0 0 0 6px rgba(var(--fg),.04),0 16px 44px rgba(0,0,0,.6),0 0 46px rgba(255,79,154,.14)}
#pad{display:block;width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair}
.tools{display:grid;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(var(--fg),.65) 0,rgba(var(--fg),0) 44%),var(--c);box-shadow:inset 0 -2px 4px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.45)}
.sw.on{box-shadow:0 0 0 2px #000,0 0 0 4px var(--pink),0 0 12px rgba(255,79,154,.5)}
.tool-row{display:flex;gap:6px;align-items:center}
.tool-row .sep{flex:1}
.tbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.tbtn svg{width:20px;height:20px}
.tbtn.on{border-color:var(--pink);color:var(--pink)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.tbtn i{display:block;border-radius:50%;background:currentColor;width:var(--d);height:var(--d)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{margin:0;border-radius:18px;overflow:hidden;display:grid}
.dimg{aspect-ratio:1;background:#fff;display:grid;place-items:center}
.dimg img{width:100%;height:100%;object-fit:cover}
.dimg.empty{background:rgba(0,0,0,.35);color:var(--muted);font-size:13px;text-align:center;padding:12px;align-content:center;gap:6px}
.dimg.lockd{background:repeating-linear-gradient(45deg,rgba(255,79,154,.07) 0 10px,rgba(255,79,154,.02) 10px 20px);color:var(--pink-soft)}
.dimg.lockd svg{width:22px;height:22px;margin:0 auto}
.dcard figcaption{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:14px;min-width:0}
.dcard figcaption span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* new post */
.picker{display:grid;place-items:center;align-content:center;gap:8px;aspect-ratio:4/3;border:1.5px dashed rgba(255,120,180,.4);border-radius:24px;color:var(--pink-soft);background:radial-gradient(80% 80% at 50% 0%,rgba(255,79,154,.16),transparent),var(--glass),var(--glass-base);cursor:pointer;text-align:center;font-size:17px}
.picker small{color:var(--muted);font-family:var(--font-ui);font-size:13px}
.picker svg{width:46px;height:46px;color:var(--pink);filter:drop-shadow(0 0 10px rgba(255,79,154,.5))}
.picker.compact{aspect-ratio:auto;padding:14px;grid-auto-flow:column;gap:10px;font-size:15px}
.picker.compact svg{width:24px;height:24px}
.picked{display:flex;gap:8px;overflow-x:auto}
.picked:empty{display:none}
.pk{position:relative;flex:none;width:96px;height:96px;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 0 0 1px rgba(var(--fg),.1)}
.pk img{width:100%;height:100%;object-fit:cover}
.pk .pk-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.72);display:grid;place-items:center}
.pk .pk-x svg{width:14px;height:14px}
.pk-first{position:absolute;left:4px;bottom:4px;font-size:12px;background:var(--candy);color:#fff;border-radius:7px;padding:1px 7px}

/* handwriting picker */
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fp{display:grid;gap:2px;padding:12px 12px 10px;border-radius:16px;text-align:left;--hw-base:17px}
.fp .hw{line-height:1.2}
.fp small{color:var(--muted);font-size:12.5px}
.fp.on{border-color:var(--pink);background:linear-gradient(180deg,rgba(255,79,154,.22),rgba(255,79,154,.07)),var(--glass-base);box-shadow:var(--hi),0 0 0 1px var(--pink),0 0 18px rgba(255,79,154,.25)}
.fp.on small{color:var(--pink-soft)}

/* profile */
.prof-back{padding:12px 16px 0}
.prof-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:16px 16px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.prof-name{padding:0 16px;font-size:17px}
.prof-bio{--hw-base:15.5px;padding:2px 16px 0;margin:0;white-space:pre-wrap}
.prof-actions{padding:12px 16px 4px}
.note-card{margin:10px 16px;padding:14px 16px;border-radius:18px;border-style:dashed;border-color:rgba(255,120,180,.35);font-size:14px}
.note-card ol{margin:8px 0;padding-left:20px;display:grid;gap:3px}
.note-card p{margin:0;font-size:13px}
.meter-wrap{margin:10px 16px 4px;display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.meter{height:7px;border-radius:4px;background:rgba(var(--fg),.06);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);overflow:hidden}
.meter i{display:block;height:100%;background:var(--candy);border-radius:4px}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:12px}
.ptabs button{height:46px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:14px;border-top:1.5px solid transparent;margin-top:-1px}
.ptabs button svg{width:18px;height:18px}
.ptabs button.on{color:var(--text);border-top-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:1;background:#0d0d0d;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.paper{background:#fff}
.tile .multi{position:absolute;top:6px;right:6px;width:18px;height:18px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile .tdate{position:absolute;left:6px;bottom:6px;font-family:var(--font-cute);font-size:12px;background:rgba(0,0,0,.66);color:#fff;padding:1px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.tile.lockt{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#160d12 0 10px,#1c1016 10px 20px);color:var(--pink-soft)}
.tile.lockt svg{width:22px;height:22px}

/* sheets & dialogs */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.overlay.center{align-items:center;padding:24px}
.sheet{width:100%;max-width:var(--col);max-height:88vh;max-height:88dvh;background:linear-gradient(180deg,rgba(48,40,45,.94),rgba(16,13,15,.97) 38%);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border:1px solid rgba(var(--fg),.12);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:inset 0 1px 0 rgba(var(--fg),.12),0 -20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-grab{width:40px;height:5px;border-radius:3px;background:rgba(var(--fg),.22);margin:8px auto 0;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 18px;border-bottom:1px solid var(--line);flex:none;min-height:52px}
.sh-head h2{font-size:18px;margin:0}
.sh-body{overflow-y:auto;padding:12px 16px 16px;flex:1;min-height:0;display:grid;align-content:start;gap:12px}
.sheet-post .sh-body{padding:0}
.sheet-post .card{border:0}
.cmt-form{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex:none}
.cmt-form input{flex:1;border-radius:999px;height:44px;padding:0 16px}
.c-item{display:grid;grid-template-columns:auto 1fr;gap:10px}
.c-item p{--hw-base:15.5px;margin:0;white-space:pre-wrap}
.c-item b{font-size:15px;margin-right:7px}
.c-meta{color:var(--muted);font-size:12px;display:flex;gap:12px;margin-top:3px}
.c-meta button{color:var(--muted);font-size:12.5px;font-family:var(--font-cute)}
.sep-line{height:1px;background:var(--line)}
.rp-prev{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;border-radius:16px;padding:8px}
.rp-prev img{width:64px;height:64px;border-radius:11px;object-fit:cover}
.rp-prev p{--hw-base:15px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:4px 0}
.a-text{font-size:14px;line-height:1.45}
.a-text b{font-size:15px}
.a-text .hw{--hw-base:14.5px}
.a-text .muted{font-size:12.5px}
.a-item .thumb{width:44px;height:44px;border-radius:9px;overflow:hidden;background:#111}
.a-item .thumb img{width:100%;height:100%;object-fit:cover}
.a-item.new .a-text::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 6px rgba(255,79,154,.8);margin-right:6px;vertical-align:middle}
.form{display:grid;gap:12px}
.lead{margin:0;font-size:15px;line-height:1.6;text-align:center}
.ep-av{display:flex;align-items:center;gap:14px}
.adopt{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.adopt button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-family:var(--font-cute)}
.dialog{background:linear-gradient(180deg,rgba(52,44,49,.96),rgba(22,18,20,.98));border:1px solid rgba(var(--fg),.12);box-shadow:inset 0 1px 0 rgba(var(--fg),.14),0 24px 60px rgba(0,0,0,.7);border-radius:20px;max-width:320px;width:100%;overflow:hidden;text-align:center;animation:up .2s}
.dialog p{padding:24px 20px;margin:0;font-size:16px}
.dialog .row{border-top:1px solid var(--line);gap:0}
.dialog .row button{flex:1;height:50px;font-family:var(--font-cute);font-size:16px}
.dialog .row button+button{border-left:1px solid var(--line)}
.danger{color:#ff5b6b}
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:linear-gradient(180deg,#fff 0%,#f6eef2 55%,#ebe0e6 100%);box-shadow:inset 0 1px 0 #fff,0 10px 30px rgba(0,0,0,.55);color:#1b1016;padding:10px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:120;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* header actions, d-day, segmented control */
.top-actions{display:flex;align-items:center}
.dday{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin:12px 16px 2px;padding:16px 18px 14px;border-radius:24px;position:relative;overflow:hidden;background:radial-gradient(90% 130% at 0% 0%,rgba(255,79,154,.30),transparent 60%),var(--glass),var(--glass-base);border:1px solid rgba(255,140,190,.22);box-shadow:var(--hi),var(--drop);text-align:left;width:calc(100% - 32px)}
.dday::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(158deg,rgba(var(--fg),.15) 0%,rgba(var(--fg),.04) 30%,transparent 48%)}
.dd-main{display:flex;align-items:baseline;gap:4px;position:relative}
.dd-main svg{width:18px;height:18px;color:var(--pink);align-self:center;filter:drop-shadow(0 0 6px rgba(255,79,154,.7))}
.dd-n{font-family:var(--font-cute);font-size:44px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.dd-u{font-family:var(--font-cute);font-size:17px}
.dd-next{justify-self:end;text-align:right;font-size:12.5px;color:var(--muted);position:relative}
.dd-next b{display:block;font-family:var(--font-cute);font-size:15px;color:var(--text)}
.dd-links{grid-column:1/-1;display:flex;gap:8px;margin-top:8px;position:relative}
.dd-links button{flex:1;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-cute);font-size:14px;background:rgba(var(--fg),.05);border:1px solid rgba(var(--fg),.1);box-shadow:var(--hi)}
.dd-links svg{width:17px;height:17px;color:var(--pink)}
.dd-links i{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;display:inline-grid;place-items:center}
.dday.empty{display:flex;justify-content:space-between;gap:12px}
.dday.empty b{font-family:var(--font-cute);font-size:17px;display:block}
.dday.empty span{font-size:13px;color:var(--muted)}
.dday.empty svg{width:26px;height:26px;color:var(--pink);flex:none;position:relative}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:rgba(var(--fg),.05);border:1px solid rgba(var(--fg),.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.seg button{height:36px;border-radius:10px;font-family:var(--font-cute);font-size:15px;color:var(--muted)}
.seg button.on{background:var(--glass),rgba(var(--fg),.08);color:var(--text);box-shadow:var(--hi),0 2px 8px rgba(0,0,0,.4)}
.story .av{position:relative}
.plus-badge{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--candy);border:2.5px solid #000;display:grid;place-items:center;color:#fff}
.plus-badge svg{width:12px;height:12px}
input[type=date],input[type=time],select{width:100%;height:48px;background:rgba(var(--fg),.035);border:1px solid rgba(var(--fg),.1);border-radius:16px;padding:0 14px;outline:none;color:var(--text);font:inherit;box-shadow:inset 0 2px 6px rgba(0,0,0,.45);color-scheme:dark}
input[type=date]:focus,input[type=time]:focus,select:focus{border-color:rgba(255,79,154,.8)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--pink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{display:grid;gap:12px}

/* calendar */
.cal-wrap{padding:14px 16px;display:grid;gap:14px}
.cal-head{display:flex;align-items:center;gap:6px}
.cal-head .pill{gap:5px;font-family:var(--font-cute);font-size:13.5px}
.cal-head .pill svg{width:15px;height:15px}
.cal-head h2{font-family:var(--font-cute);font-weight:400;font-size:23px;margin:0 auto 0 0}
.cal-nav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(var(--fg),.05);border:1px solid rgba(var(--fg),.1);box-shadow:var(--hi)}
.cal-meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-family:var(--font-cute);font-size:12.5px;color:var(--muted);padding:2px 0}
.cal-wd.sun{color:#ff8fae}
.cal-cell{position:relative;aspect-ratio:1/1.15;border-radius:12px;overflow:hidden;background:rgba(var(--fg),.035);border:1px solid rgba(var(--fg),.06);padding:0}
.cal-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.cal-cell .num{position:absolute;top:4px;left:6px;font-family:var(--font-cute);font-size:13.5px;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.cal-cell.sun .num{color:#ff9cb6}
.cal-cell .mks{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:3px;align-items:center}
.mk-heart{display:grid}
.mk-heart svg{width:13px;height:13px;color:var(--pink);filter:drop-shadow(0 0 4px rgba(255,79,154,.9))}
.mk{width:6px;height:6px;border-radius:50%;display:inline-block}
.mk.plan{background:#7dd3fc}
.mk.letter{background:#fcd34d}
.cal-cell.anniv{border-color:rgba(255,79,154,.6);background:linear-gradient(180deg,rgba(255,79,154,.24),rgba(255,79,154,.06))}
.cal-cell.today{box-shadow:inset 0 0 0 2px rgba(var(--fg),.85)}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--pink),0 0 14px rgba(255,79,154,.5)}
.cal-cell.blank{background:none;border:0}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.panel{border-radius:22px;padding:16px;display:grid;gap:10px;background:var(--glass),var(--glass-base);border:1px solid rgba(var(--fg),.09);box-shadow:var(--hi),var(--drop)}
.panel h3{font-family:var(--font-cute);font-weight:400;font-size:18px;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h3 small{font-family:var(--font-ui);font-size:12.5px;color:var(--pink-soft)}
.ev{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0 0;border-top:1px solid var(--line);text-align:left;width:100%}
.ev-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,79,154,.15);color:var(--pink)}
.ev-ic svg{width:16px;height:16px}
.ev-ic.plan{background:rgba(125,211,252,.14);color:#7dd3fc}
.ev-ic.letter{background:rgba(252,211,77,.14);color:#fcd34d}
.ev b{font-family:var(--font-cute);font-size:15px;display:block}
.ev small{display:block;color:var(--muted);font-size:12.5px;white-space:pre-wrap}
.ev .dn{font-family:var(--font-cute);font-size:13px;color:var(--pink);white-space:nowrap}
.strip{display:flex;gap:6px;overflow-x:auto;padding-top:2px}
.strip button{flex:none;width:74px;height:74px;border-radius:12px;overflow:hidden;background:#111}
.strip button.paper{background:#fff}
.strip img{width:100%;height:100%;object-fit:cover}
.mini-q{font-family:var(--font-hand);font-size:24px;line-height:1.15;margin:0}

/* letters */
.lt-wrap{padding:16px;display:grid;gap:14px}
.lt-hero{display:flex;align-items:center;gap:12px}
.lt-hero h2{font-family:var(--font-cute);font-weight:400;font-size:23px;margin:0}
.lt-hero p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.lt-hero .btn{margin-left:auto;flex:none}
.env{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:20px;text-align:left;width:100%;background:var(--glass),var(--glass-base);border:1px solid rgba(var(--fg),.09);box-shadow:var(--hi),var(--drop)}
.seal{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffb0d2,#e0247a 58%,#8f0f48);display:grid;place-items:center;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35),0 4px 14px rgba(255,79,154,.35);color:#fff}
.seal svg{width:22px;height:22px}
.env.opened .seal{background:radial-gradient(circle at 35% 28%,#fff,#ffd6e7 60%,#f3a6c8);color:#e0247a}
.env b{font-family:var(--font-cute);font-size:16px;display:block}
.env p{margin:2px 0 0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env small{color:var(--muted);font-size:12.5px}
.env .dn{font-family:var(--font-cute);font-size:14px;color:var(--pink);white-space:nowrap}
.paper{color:#2b1620;border-radius:18px;padding:22px 20px 18px;box-shadow:0 12px 34px rgba(0,0,0,.45);background:linear-gradient(180deg,#fffafc,#fff0f6)}
.paper h3{font-family:var(--font-cute);font-weight:400;font-size:19px;margin:0 0 6px}
.paper .to,.paper .from{font-family:var(--font-cute);font-size:15px;color:#a3155a}
.paper .from{text-align:right;margin-top:6px}
.paper .body{--hw-base:18px;white-space:pre-wrap;margin:10px 0 0;line-height:32px;background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(224,36,122,.16) 31px 32px)}
.paper .body.hw{line-height:32px}
.paper .meta{font-size:12px;color:#8a6475;text-align:right;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(var(--fg),.14);font-family:var(--font-cute);font-size:13.5px;background:rgba(var(--fg),.04)}
.chips button.on{border-color:var(--pink);color:var(--pink)}

/* our own questions */
.myq{border-radius:20px;padding:14px 16px;display:grid;gap:8px;background:radial-gradient(100% 120% at 100% 0%,rgba(255,79,154,.16),transparent 60%),var(--glass),var(--glass-base);border:1px solid rgba(255,140,190,.2);box-shadow:var(--hi),var(--drop)}
.myq p{margin:0;font-size:13.5px;color:var(--muted)}
.q-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.q-item .hw{--hw-base:16px}
.q-item small{display:block;color:var(--muted);font-size:12px}

/* stories viewer & highlights */
.viewer{position:fixed;inset:0;z-index:90;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.vw-bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:4px;z-index:3}
.vw-bars i{flex:1;height:3px;border-radius:2px;background:rgba(var(--fg),.32);overflow:hidden}
.vw-bars i b{display:block;height:100%;width:0;background:#fff}
.vw-bars i.done b{width:100%}
.vw-bars .cnt{flex:none;font-family:var(--font-cute);font-size:13px;margin-left:auto;background:rgba(0,0,0,.5);padding:2px 9px;border-radius:999px}
.vw-head{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:12px;right:4px;display:flex;align-items:center;gap:8px;z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.vw-head .nm{font-family:var(--font-cute);font-size:15px}
.vw-head small{color:rgba(var(--fg),.78);font-size:12.5px}
.vw-sp{flex:1}
.viewer .ic{color:#fff}
.vw-stage{position:absolute;inset:0;display:grid;place-items:center}
.vw-stage img{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.vw-stage img.paper{background:#fff;height:auto;max-height:100%;aspect-ratio:1}
.vw-foot{position:absolute;left:0;right:0;bottom:0;padding:48px 16px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);z-index:3;display:grid;gap:10px}
.vw-foot:empty{display:none}
.vw-foot .cap{padding:0;margin:0}
.vw-foot .row{flex-wrap:wrap}
.vw-foot .btn{height:40px;font-size:14px;padding:0 14px}
.hl-row{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.hl-row::-webkit-scrollbar{display:none}
.hl{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none;font-family:var(--font-cute);font-size:12.5px}
.hl span.t{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl.add .av-in{background:rgba(var(--fg),.04);border:1.5px dashed rgba(var(--fg),.3);color:var(--text)}
.hl.add .av-in svg{width:22px;height:22px}
.pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pick-grid button{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#111}
.pick-grid img{width:100%;height:100%;object-fit:cover}
.pick-grid button.on{box-shadow:inset 0 0 0 3px var(--pink)}
.pick-grid button.on img{opacity:.75}
.pick-grid .no{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:var(--candy);color:#fff;font-family:var(--font-cute);font-size:12px;display:grid;place-items:center}
.pick-grid .tag{position:absolute;left:5px;bottom:5px;font-size:10.5px;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.62);font-family:var(--font-cute)}
.hl-pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;font-family:var(--font-cute);width:100%;text-align:left}
.hl-pick.on{border-color:var(--pink);color:var(--pink)}

/* notification settings */
.noti{margin:12px 16px;padding:14px 16px;border-radius:20px;display:grid;gap:10px;background:var(--glass),var(--glass-base);border:1px solid rgba(var(--fg),.09);box-shadow:var(--hi),var(--drop)}
.noti p{margin:0;font-size:13.5px;color:var(--muted)}
.noti .ok{color:#7ee2a8}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0 0;border-top:1px solid var(--line)}
.tg input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:rgba(var(--fg),.14);position:relative;cursor:pointer;flex:none;transition:background .2s;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);margin:0}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#fff,#e6dfe3);box-shadow:0 2px 4px rgba(0,0,0,.4);transition:transform .2s}
.tg input:checked{background:var(--candy)}
.tg input:checked::after{transform:translateX(18px)}
.tg select{width:auto;height:38px;border-radius:12px}

/* login */
.login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;overflow:auto;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.login-card{width:100%;max-width:380px;display:grid;gap:12px;padding:28px 22px 22px;border-radius:28px;background:var(--glass),rgba(16,12,14,.72);border:1px solid rgba(var(--fg),.12);box-shadow:var(--hi),0 30px 80px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.login-card .w-hero{padding:0}
.login-err{color:#ff7a8a;min-height:1.2em;margin:0;font-size:13.5px}
.acct{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
@keyframes up{from{transform:translateY(36px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== v4 design layer: Apple-like, minimal, pink + black (dark) / pink + soft white (light) ===== */
.app{border-color:var(--line)}
.top{background:var(--bar);box-shadow:none;border-bottom:.5px solid var(--line);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.top-left{display:flex;align-items:center;gap:2px;min-width:0}
.top-left .ic{margin-left:-10px}
.logo{filter:none}
.tabs{background:var(--bar);box-shadow:none;border-top:.5px solid var(--line);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.tabs a.on svg{filter:none}
.tabs a[data-nav="new"].on svg{filter:none}
.tabs a.on .av{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}
.dot{box-shadow:0 0 0 2px var(--bg)}
.q-card,.ans,.teaser,.history,.dcard,.rp-prev,.note-card,.fp,.tbtn,.panel,.env,.noti,.myq{border:.5px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
.q-card::before,.dday::before{display:none}
.q-card{background:radial-gradient(120% 90% at 100% 0%,rgba(255,79,154,.22),transparent 60%),var(--surface);border-color:rgba(255,79,154,.18)}
.q-text{color:var(--text);text-shadow:none}
.dday{background:radial-gradient(90% 130% at 0% 0%,rgba(255,79,154,.18),transparent 60%),var(--surface);border:.5px solid rgba(255,79,154,.2)}
.myq{background:radial-gradient(100% 120% at 100% 0%,rgba(255,79,154,.12),transparent 60%),var(--surface)}
.btn{border-radius:14px}
.btn.primary{background:var(--candy);border:0;text-shadow:none;box-shadow:var(--candy-hi)}
.btn.ghost{background:var(--field);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.ghost.sm,.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.ghost.danger{color:#ff5b6b}
.pill{background:var(--candy);text-shadow:none;box-shadow:none}
.pill.ghost{background:transparent;box-shadow:none;border:1px solid var(--pink)}
.chip.need{text-shadow:none;border:0}
.picker{background:radial-gradient(80% 80% at 50% 0%,rgba(255,79,154,.10),transparent 70%),var(--surface);border:1.5px dashed rgba(255,79,154,.45);box-shadow:none}
textarea,input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select{background:var(--field);border:1px solid transparent;box-shadow:none}
textarea:focus,input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,input[type=date]:focus,input[type=time]:focus,select:focus{border-color:rgba(255,79,154,.7);box-shadow:0 0 0 3px rgba(255,79,154,.15)}
.av-in{background:var(--av-bg);color:var(--pink);box-shadow:none}
.qbubble{background:var(--av-bg)}
.av.ring{box-shadow:none}
.av.ring .av-in{border-color:var(--bg)}
.av.ring.seen{background:var(--seen-ring)}
.plus-badge{border-color:var(--bg)}
.media,.tile,.pk,.strip button,.pick-grid button,.a-item .thumb{background:var(--media-bg)}
.tile.lockt{background:repeating-linear-gradient(45deg,rgba(var(--fg),.04) 0 10px,rgba(var(--fg),.02) 10px 20px);--fg:inherit}
.h-thumbs span.lk{background:var(--surface-2)}
.dimg.empty{background:var(--field)}
.meter{background:var(--field);box-shadow:none}
.overlay{background:rgba(0,0,0,.42)}
.sheet{background:var(--sheet);border:0;box-shadow:0 -10px 40px rgba(0,0,0,.28);-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:22px 22px 0 0}
.sh-grab{background:rgba(var(--fg),.2)}
.sh-head{border-bottom:.5px solid var(--line)}
.dialog{background:var(--sheet);border:0;box-shadow:0 20px 60px rgba(0,0,0,.35);border-radius:18px}
.toast{background:var(--toast-bg);color:var(--toast-fg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.login-card{background:var(--surface);border:.5px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.seg{background:var(--field);border:0;box-shadow:none;border-radius:12px;padding:3px}
.seg button{border-radius:9px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px var(--line)}
:root[data-theme=light] .seg button.on{background:#fff}
.tg input{background:rgba(var(--fg),.16);box-shadow:none;width:51px;height:31px;border-radius:16px}
.tg input::after{top:2px;left:2px;width:27px;height:27px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tg input:checked{background:var(--pink)}
.tg input:checked::after{transform:translateX(20px)}
.cal-cell{border-color:var(--line)}
:root[data-theme=light] .cal-cell .num{text-shadow:none}
:root[data-theme=light] .cal-cell.ph .num{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.burst svg{filter:drop-shadow(0 6px 20px rgba(255,79,154,.5))}
.pk .pk-ed,.pk .pk-x{color:#fff}

/* profile */
.prof-av{padding:0;border-radius:50%}
.prof-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof-actions .btn{height:38px;font-size:14.5px}
.prof-actions .btn svg{width:17px;height:17px}

/* per-photo captions */
.pcap{--hw-base:15.5px;display:flex;gap:8px;align-items:baseline;margin:8px 14px 0;padding:8px 12px;border-radius:12px;background:var(--field);white-space:pre-wrap}
.pcap.empty .pc-t{display:none}
.pcap.empty{background:transparent;padding:0 2px;margin-top:6px}
.pc-n{flex:none;font-family:var(--font-cute);font-size:12px;color:var(--pink);font-variant-numeric:tabular-nums}
.cap.pc{display:flex;gap:8px;align-items:baseline;font-size:17px}
.cap.sub{opacity:.8;font-size:14px}
.pcaps{display:grid;gap:8px}
.pcaps-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pcaps-h b{font-size:15px}
.pcaps-h span{font-size:12.5px;color:var(--muted)}
.pcap-row{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;position:relative}
.pcap-row img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--media-bg)}
.pcap-row .n{position:absolute;left:3px;top:3px;min-width:16px;height:16px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;display:grid;place-items:center;font-family:var(--font-cute)}
.pcap-row input{height:44px;border-radius:12px}

/* comments + replies */
.c-item.reply{margin-left:42px}
.c-item .at{color:var(--pink);font-family:var(--font-cute);margin-right:2px}
.reply-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 2px 16px;background:var(--field);font-size:13.5px;color:var(--muted);flex:none}
.reply-bar b{color:var(--text)}

/* viewer: story reactions */
.viewer .btn.ghost{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16)}
.viewer .btn.ghost svg{width:17px;height:17px}
.vw-seen{display:inline-flex;align-items:center;gap:8px;justify-self:start;max-width:100%;padding:6px 12px 6px 8px;border-radius:999px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);font-family:var(--font-cute);font-size:14px;color:#fff;text-align:left}
.vw-seen > svg{width:20px;height:20px}
.vw-seen .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-seen .stack{display:inline-flex}
.vw-seen .stack .av + .av{margin-left:-7px}
.vw-seen .stack .av{box-shadow:0 0 0 1.5px #000;border-radius:50%}
.vw-chip{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:#ffb3d4}
.vw-chip svg{width:14px;height:14px;color:var(--pink)}
.vw-react{display:flex;align-items:center;gap:6px}
.vw-reply{flex:1;min-width:0}
.vw-reply input{height:46px;border-radius:23px;padding:0 18px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.55);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.vw-reply input::placeholder{color:rgba(255,255,255,.75)}
.vw-reply input:focus{border-color:#fff;box-shadow:none}
.vw-react-btns{display:flex;align-items:center}
.vw-ib{position:relative;width:44px;height:46px;display:grid;place-items:center;color:#fff}
.vw-ib svg{width:27px;height:27px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.vw-ib.like.on{color:var(--pink)}
.vw-ib i{position:absolute;top:4px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--pink);color:#fff;font-style:normal;font-size:10.5px;display:grid;place-items:center;font-family:var(--font-cute)}
#vw-burst{z-index:2}

/* sheets: story reactions, share, settings lists */
.sa-top{display:flex;align-items:center;gap:12px}
.sa-thumb{width:46px;height:64px;border-radius:9px;overflow:hidden;flex:none;background:var(--media-bg)}
.sa-thumb img{width:100%;height:100%;object-fit:cover}
.sa-top b{display:block;font-size:15.5px}
.sa-top small{color:var(--muted);font-size:12.5px}
.sa-heart{color:var(--pink)}
.sa-heart svg{width:20px;height:20px}
.sh-grid{margin:0 -16px}
.tile.story-t{aspect-ratio:9/16}
.tile .live{position:absolute;top:6px;left:6px;font-family:var(--font-cute);font-size:11px;background:var(--pink);color:#fff;padding:1px 7px;border-radius:7px}
.mc-item{display:flex;align-items:center;gap:10px}
.mc-go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.mc-go .thumb{width:44px;height:44px;border-radius:9px;overflow:hidden;flex:none;background:var(--media-bg)}
.mc-go .thumb img{width:100%;height:100%;object-fit:cover}
.mc-go .grow{min-width:0;display:grid;--hw-base:15px}
.mc-go small{color:var(--muted);font-size:12px}
.mp-item{display:grid;grid-template-columns:56px 1fr;gap:6px 12px;align-items:center;padding-bottom:12px;border-bottom:.5px solid var(--line)}
.mp-item .thumb{position:relative;width:56px;height:56px;border-radius:11px;overflow:hidden;background:var(--media-bg);grid-row:span 2}
.mp-item .thumb img{width:100%;height:100%;object-fit:cover}
.mp-item .thumb .n{position:absolute;right:3px;bottom:3px;font-size:10.5px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 5px;font-family:var(--font-cute)}
.mp-item .grow{min-width:0}
.mp-item .grow p{--hw-base:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-item .grow small{color:var(--muted);font-size:12px}
.mp-btns{display:flex;gap:6px}

/* settings (grouped, like the iPhone's Settings app) */
.set-wrap{padding:6px 16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;align-content:start}
.set-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin:4px -8px 10px}
.set-head h2{text-align:center;font-family:var(--font-cute);font-weight:400;font-size:19px;margin:0}
.set-cap{font-family:var(--font-cute);font-size:13px;color:var(--muted);padding:18px 14px 7px;letter-spacing:.02em}
.set-group{background:var(--surface);border-radius:16px;overflow:hidden;border:.5px solid var(--line)}
.sheet .set-group{background:var(--surface-2);border:0}
:root[data-theme=light] .sheet .set-group{background:#f6f3f5}
.sheet .set-cap{padding:6px 4px 6px}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 14px;text-align:left;position:relative;font-size:15.5px}
.set-row + .set-row,.set-row + label.set-row,label.set-row + .set-row{border-top:.5px solid var(--line)}
.set-row.col{display:grid;gap:10px;align-items:stretch}
.set-row .grow{flex:1;min-width:0;display:grid}
.set-row small{color:var(--muted);font-size:12.5px;font-family:var(--font-ui)}
.set-row > svg:first-child{width:22px;height:22px;color:var(--pink);flex:none}
.set-row .chev{width:16px;height:16px;color:var(--muted);flex:none}
.set-row .val{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14.5px}
.set-row.danger{color:#ff4d5e;justify-content:center}
.set-row.danger .grow{text-align:center}
.set-row select{width:auto;height:36px;border-radius:10px;padding:0 10px}
.set-row.tgl input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:rgba(var(--fg),.16);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.set-row.tgl input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.set-row.tgl input:checked{background:var(--pink)}
.set-row.tgl input:checked::after{transform:translateX(20px)}
.set-me b{font-family:var(--font-cute);font-weight:400;font-size:18px}
.set-note{margin:0;font-size:13.5px;color:var(--muted)}
.set-note b{color:var(--text)}
.set-note .ok{color:#34c759}
.set-btns{display:flex;gap:8px;flex-wrap:wrap}
.set-btns .btn{flex:1;height:42px;font-size:15px}
.set-foot{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 0;font-family:var(--font-logo);font-size:20px;opacity:.6}
.link-row{cursor:pointer}
.link-row:active{background:var(--field)}

/* iPhone zooms the whole page when a text box under 16px is tapped, and then stays zoomed.
   Every text box is 16px or more, and double-tap zoom is off (pinch zoom still works). */
html{touch-action:manipulation}
input:not(.hw):not([type=range]):not([type=checkbox]),select,textarea:not(.hw):not(#ed-ta){font-size:16px!important}

/* ===== v5: feel — springy viewer, sheets, screens; mentions ===== */
.viewer{background:transparent}
.vw-bg{position:absolute;inset:0;background:#000}
.vw-card{position:absolute;inset:0;overflow:hidden;background:#000;transform-origin:50% 42%;will-change:transform}
.viewer.opening .vw-card{animation:vwIn .42s cubic-bezier(.2,1.15,.35,1)}
.viewer.opening .vw-bg{animation:fade .25s ease-out}
.viewer.closing{pointer-events:none}
@keyframes vwIn{from{transform:scale(.88);opacity:0;border-radius:28px}}
.sheet{animation:sheetUp .5s cubic-bezier(.2,1.12,.35,1)}
@keyframes sheetUp{from{transform:translate3d(0,100%,0)}}
.overlay{animation:fade .22s ease-out;transition:background-color .26s ease-out}
.overlay.closing{pointer-events:none;background-color:rgba(0,0,0,0)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
.sh-grab{position:relative}
.sh-grab::after{content:"";position:absolute;left:-40px;right:-40px;top:-10px;bottom:-12px}
.v-fade{animation:vFade .34s cubic-bezier(.2,.8,.2,1)}
.v-push{animation:vPush .42s cubic-bezier(.2,.95,.25,1)}
.v-pop{animation:vPop .42s cubic-bezier(.2,.95,.25,1)}
.v-drag{position:relative;z-index:1;background:var(--bg);-webkit-user-select:none;user-select:none;box-shadow:-16px 0 36px rgba(0,0,0,.3);min-height:100vh}
@keyframes vFade{from{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes vPush{from{opacity:.3;transform:translate3d(32%,0,0)}}
@keyframes vPop{from{opacity:.3;transform:translate3d(-22%,0,0)}}
.ptr{position:fixed;top:64px;left:50%;z-index:15;width:36px;height:36px;display:grid;place-items:center;color:var(--pink);opacity:0;transform:translate3d(-50%,-30px,0) scale(.5);pointer-events:none}
.ptr svg{width:28px;height:28px;transition:filter .2s}
.ptr.ready svg{filter:drop-shadow(0 0 10px rgba(255,79,154,.7))}
.ptr.spin svg{animation:beat .75s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}55%{transform:scale(.94)}}
/* press feedback, like iPhone buttons */
.btn,.ic,.act,.story,.vw-ib,.hl,.tabs a,.seg button,.chips button,.ed-chip,.dd-links button,.cal-nav,.tile,.pk-img,.set-row.link-row,.vw-seen,.mention-pop button{transition:transform .22s cubic-bezier(.2,1.5,.4,1),background-color .15s,opacity .15s}
.btn:active,.dd-links button:active,.vw-seen:active{transform:scale(.96)}
.ic:active,.act:active,.vw-ib:active,.tabs a:active,.cal-nav:active{transform:scale(.86)}
.story:active,.hl:active{transform:scale(.93)}
.tile:active,.pk-img:active{transform:scale(.97);opacity:.85}
.seg button:active,.chips button:active,.ed-chip:active{transform:scale(.95)}
/* mentions */
.mention{display:inline;padding:0;margin:0 1px;font:inherit;color:var(--pink);font-family:var(--font-cute);font-size:.92em;vertical-align:baseline}
.viewer .mention{color:#ffb3d4}
.vw-men{display:inline-flex;gap:6px;margin-left:6px}
.vw-men .mention{background:rgba(255,255,255,.18);color:#fff;padding:1px 8px;border-radius:999px;font-size:12.5px}
.mention-pop{position:fixed;z-index:130;display:flex;gap:6px;padding:6px;border-radius:16px;background:var(--surface);border:.5px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.28);max-width:calc(100vw - 16px);overflow-x:auto}
.mention-pop button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:12px;white-space:nowrap}
.mention-pop button:active{background:var(--field);transform:scale(.96)}
.mention-pop b{font-family:var(--font-cute);font-weight:400;color:var(--pink);font-size:15px}
.ed-bgs{gap:9px}
.ed-bg{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.75);box-shadow:0 1px 4px rgba(0,0,0,.45);display:grid;place-items:center;padding:0}
.ed-bg i{font-style:normal;font-size:9.5px;color:#fff;font-family:var(--font-cute)}
.ed-bg.on{outline:2.5px solid var(--pink);outline-offset:2px}
.av-pop{animation:avPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes avPop{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ===== our rabbit ===== */
.coin{width:18px;height:18px;flex:none;vertical-align:-3px}
.coin-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px 3px 6px;border-radius:999px;background:var(--field);font-family:var(--font-cute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin-pill.big{font-size:16px;padding:5px 12px 5px 8px}
.coin-pill.big .coin{width:22px;height:22px}
.pet-bar{display:block;height:7px;border-radius:4px;background:var(--field);overflow:hidden}
.pet-bar i{display:block;height:100%;border-radius:4px;background:var(--candy);transition:width .6s cubic-bezier(.2,1,.3,1)}
.pet-card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:calc(100% - 32px);margin:10px 16px 2px;padding:10px 14px 10px 8px;border-radius:22px;background:radial-gradient(80% 120% at 0% 100%,rgba(255,79,154,.14),transparent 60%),var(--surface);border:.5px solid var(--line);text-align:left}
.pc-pet{width:64px;height:66px;display:grid;place-items:end center}
.pc-pet .pet{width:64px;height:70px}
.pc-info{min-width:0;display:grid;gap:5px}
.pc-info b{font-family:var(--font-cute);font-weight:400;font-size:16px}
.pc-info b small{font-size:12.5px;color:var(--pink)}
.pc-info > small{color:var(--muted);font-size:12px}
.pet{display:block;overflow:visible}
.pet .pet-body,.pet .pet-ear,.pet .pet-eyes,.pet .pet-head,.pet .pet-wing,.pet-hop{transform-box:fill-box}
.pet .pet-body{transform-origin:50% 100%}
.pet .pet-ear{transform-origin:50% 100%}
.pet .pet-eyes{transform-origin:50% 50%}
.pet .pet-wing.l{transform-origin:100% 70%}
.pet .pet-wing.r{transform-origin:0% 70%}
.pet-hop{transform-origin:50% 100%}
.pet.idle .pet-body,.pet-room-svg .pet-body{animation:petBreathe 3.2s ease-in-out infinite}
.pet.idle .pet-ear.l,.pet-room-svg .pet-ear.l{animation:earL 5.5s ease-in-out infinite}
.pet.idle .pet-ear.r,.pet-room-svg .pet-ear.r{animation:earR 5.5s ease-in-out infinite .5s}
.pet.idle .pet-eyes,.pet-room-svg .pet-eyes{animation:blink 4.8s infinite}
.pet.idle .pet-wing.l,.pet-room-svg .pet-wing.l{animation:wingL 2.4s ease-in-out infinite}
.pet.idle .pet-wing.r,.pet-room-svg .pet-wing.r{animation:wingR 2.4s ease-in-out infinite}
@keyframes petBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.972)}}
@keyframes earL{0%,68%,100%{transform:rotate(0)}74%{transform:rotate(-9deg)}82%{transform:rotate(4deg)}88%{transform:rotate(0)}}
@keyframes earR{0%,68%,100%{transform:rotate(0)}74%{transform:rotate(9deg)}82%{transform:rotate(-4deg)}88%{transform:rotate(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes wingL{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes wingR{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
.pet-hop.go{animation:hop .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes hop{0%{transform:none}18%{transform:scale(1.1,.86)}48%{transform:translateY(-34px) scale(.94,1.08)}74%{transform:scale(1.07,.92)}100%{transform:none}}
.pet-wrap{padding:6px 16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.pet-top{display:grid;grid-template-columns:42px 1fr auto;align-items:center;margin:4px -8px 0 -8px}
.pet-top h2{margin:0;text-align:center;font-family:var(--font-cute);font-weight:400;font-size:19px}
.pet-top h2 button{display:inline-flex;align-items:center;gap:5px}
.pet-top h2 svg{width:15px;height:15px;color:var(--muted)}
.pet-room{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:360/280;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 12px 34px rgba(0,0,0,.28);border:.5px solid var(--line);background:#fff5ee}
.pet-room-svg{display:block;width:100%;height:100%}
.pet-tap{cursor:pointer}
.pet-say{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#fff;color:#2a1c23;font-family:var(--font-cute);font-size:15px;padding:7px 14px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap;pointer-events:none}
.pet-say::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.pet-say.go{animation:sayIn .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes sayIn{from{transform:translate(-50%,8px) scale(.7);opacity:0}}
.pet-heart{position:absolute;bottom:38%;width:26px;height:26px;color:#ff4f86;pointer-events:none;animation:heartUp 1.1s ease-out forwards}
.pet-heart svg{width:100%;height:100%}
@keyframes heartUp{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{transform:translateY(-90px) scale(.9);opacity:0}}
.pet-stage{display:grid;gap:8px;padding:14px 16px;border-radius:20px;background:var(--surface);border:.5px solid var(--line)}
.pet-stage p{margin:0;font-size:13.5px}
.pet-stage p b{font-family:var(--font-cute);font-weight:400;color:var(--pink)}
.ps-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ps-row > b{font-family:var(--font-cute);font-weight:400;font-size:18px}
.ps-row span{display:flex;gap:4px}
.ps-row i{font-style:normal;font-family:var(--font-cute);font-size:12px;padding:2px 9px;border-radius:999px;background:var(--field);color:var(--muted)}
.ps-row i.on{background:rgba(255,79,154,.16);color:var(--pink)}
.pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pet-item{display:grid;justify-items:center;gap:4px;padding:10px 6px 9px;border-radius:18px;background:var(--surface);border:.5px solid var(--line);text-align:center}
.pet-item.on{border-color:var(--pink);box-shadow:0 0 0 1.5px var(--pink) inset}
.pet-item[aria-disabled=true]{opacity:.45}
.pi-icon{width:70px;height:70px;display:grid;place-items:center}
.pi-icon svg{width:100%;height:100%}
.pi-name{font-family:var(--font-cute);font-size:13px;line-height:1.25;min-height:2.5em;display:grid;place-items:center}
.pi-price{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-cute);font-size:12.5px;color:var(--muted)}
.pet-item.on .pi-price{color:var(--pink)}
.pi-price .coin{width:15px;height:15px}
.pet-item.legend{background:radial-gradient(90% 90% at 50% 0%,rgba(255,80,60,.22),transparent 70%),var(--surface);border-color:rgba(255,120,80,.45)}
.pet-item.legend .pi-name{color:#ff5a4a}
.pet-up{position:fixed;inset:0;z-index:115;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .25s}
.pet-up-in{width:100%;max-width:340px;display:grid;gap:10px;justify-items:center;text-align:center;padding:24px 20px 18px;border-radius:28px;background:var(--sheet);box-shadow:0 30px 80px rgba(0,0,0,.4);animation:sheetUp .55s cubic-bezier(.2,1.3,.35,1)}
.pet-up-in h2{margin:0;font-family:var(--font-cute);font-weight:400;font-size:22px}
.pet-up-in p{margin:0;color:var(--muted);font-size:14px}
.pet-up-in .pu-letters{display:flex;align-items:center;gap:6px;color:var(--pink);font-family:var(--font-cute);font-size:15px}
.pet-up-in .pu-letters svg{width:18px;height:18px}
.pet-up-in .btn{width:100%}
.pu-burst{position:relative;width:170px;height:170px;display:grid;place-items:end center}
.pu-burst::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:repeating-conic-gradient(rgba(255,79,154,.22) 0 10deg,transparent 10deg 24deg);animation:spin 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.pu-burst .pet{position:relative;width:150px;height:165px;animation:hop 1s cubic-bezier(.3,1.4,.5,1) .3s}
@keyframes spin{to{transform:rotate(360deg)}}
.lw-pet{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--field);margin-top:8px}
.lw-pet p{margin:0;font-size:13.5px;color:var(--muted)}
.lw-pet b{font-family:var(--font-cute);font-weight:400;color:var(--text);font-size:15px}
.lw-pet-ic .pet{width:62px;height:68px}
.seg button svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
/* update 7: profile post feed, 썸원 import, drawing replay */
#v-pfeed{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.pf-head{position:sticky;top:58px;z-index:5;margin:0;padding:6px 8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:.5px solid var(--line)}
.pf-head h2{display:grid;line-height:1.15}
.pf-head h2 small{font-size:12px;color:var(--muted);font-family:inherit}
.imp{display:grid;gap:12px;padding-bottom:6px}
.imp-lead{margin:0;font-size:15px;line-height:1.55}
.imp-notes{margin:0;padding:12px 14px 12px 30px;border-radius:14px;background:rgba(var(--fg),.05);font-size:13.5px;line-height:1.6;color:var(--muted)}
.imp-err{margin:0;padding:10px 12px;border-radius:12px;background:rgba(255,79,154,.12);color:var(--pink);font-size:13.5px;line-height:1.5}
.imp-pick{cursor:pointer;text-align:center}
.imp-small{margin:0;font-size:12.5px;line-height:1.5}
.imp-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imp-sum div{display:grid;justify-items:center;gap:2px;padding:12px 6px;border-radius:14px;background:rgba(var(--fg),.05)}
.imp-sum b{font-family:var(--font-cute);font-weight:400;font-size:19px;color:var(--pink)}
.imp-sum small{font-size:12px;color:var(--muted)}
.imp-map{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:54px}
.imp-map + .imp-map{border-top:.5px solid var(--line)}
.imp-map b{display:block;font-family:var(--font-cute);font-weight:400}
.imp-map small{font-size:12px;color:var(--muted)}
.imp-map select{max-width:52%;border-radius:10px;padding:6px 10px;background:var(--field);color:var(--fg-solid,inherit);border:0}
.imp-dates{display:grid;gap:8px;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:2px}
.imp-d{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:rgba(var(--fg),.04)}
.imp-d small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;line-height:1.35}
.imp-d input{width:100%;padding:6px 10px;border-radius:10px;border:0;background:var(--field);color:inherit}
.imp-th{display:flex;gap:3px;flex:none}
.imp-th img{width:46px;height:46px;border-radius:9px;background:#fff;object-fit:cover}
.imp-done{display:flex;align-items:center;gap:8px;font-family:var(--font-cute);font-size:20px;color:var(--pink)}
.imp-done svg{width:24px;height:24px}
.imp .meter.big{height:10px}
.imp .row{display:flex;gap:8px;justify-content:flex-end}
.rp-btn{display:inline-flex;align-items:center;gap:3px;margin-left:auto;color:var(--pink)}
.rp-btn svg{width:13px;height:13px}
.dcard figcaption .rp-btn + .link{margin-left:6px}
